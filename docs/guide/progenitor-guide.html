<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help</title>
<!--
  Progenitor help page. One self-contained file: it opens from disk with no server and no network.
  Edit only the content block between HELP-CONTENT START and HELP-CONTENT END (templates/help/README.md).
  Everything else (style, renderer, navigation) is shared: tools/help-guide/sync.mjs copies it from
  templates/help/index.html into docs/guide/progenitor-guide.html.
-->
<style>
:root {
  /* Colors from the game's menus and Progenitor's kit (src/Progenitor.Core/Ui/MenuPalette.cs). */
  --bg: #0a0506;
  --panel: #170709;
  --panel-2: #1f090c;
  --panel-hi: #2a0c11;
  --rule: #3a1418;
  --rule-soft: #2a0f13;
  --red: #a8242a;
  --red-hi: #c8323c;
  --title-red: #c8323c;
  --text: #ece8e2;
  --body: #d2cbc4;
  --muted: #958d8a;
  --btn-fill: #111827;
  --btn-fill-hi: #17213a;
  --btn-border: #3d4f73;
  --btn-border-hi: #7088b8;
  --btn-text: #d6deec;
  --gold: #e0b25a;
  --ok: #6fd08a;
  --pend: #e8c25a;
  --warn: #f0955a;
  --danger: #e0565e;
  --code-bg: #0c0708;
  --code-text: #cfc4b8;
  --focus: #9fb6e6;
  --serif: Georgia, "Times New Roman", Times, serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", "SFMono-Regular", Menlo, "Liberation Mono", monospace;
  --sidebar: 280px;
  --top: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 70% 55% at 65% -5%, rgba(120, 20, 28, 0.32), transparent 70%),
    radial-gradient(ellipse 55% 45% at 0% 105%, rgba(90, 14, 20, 0.30), transparent 70%);
  background-attachment: fixed;
  color: var(--body);
  font: 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: #b9c9ea; text-decoration-color: rgba(185, 201, 234, 0.4); text-underline-offset: 3px; }
a:hover { color: #dfe7f7; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 60; background: var(--panel); color: var(--text); padding: 8px 12px; }
.skip:focus { left: 8px; }

/* Buttons: the game's gray-blue framed button */
.btn {
  font: 600 14px/1 var(--sans); color: var(--btn-text);
  background: linear-gradient(180deg, var(--btn-fill-hi), var(--btn-fill));
  border: 1px solid var(--btn-border); border-radius: 2px;
  padding: 9px 14px; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.btn:hover { border-color: var(--btn-border-hi); color: #fff; }
.btn[disabled] { opacity: 0.45; cursor: default; border-color: #2a3550; color: var(--muted); }

/* Layout */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); grid-template-rows: auto 1fr auto; min-height: 100vh; }
.app.toc-closed { grid-template-columns: 0 minmax(0, 1fr); }
.top {
  grid-column: 1 / -1; position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px; min-height: var(--top); padding: 8px 20px;
  background: linear-gradient(180deg, rgba(30, 8, 11, 0.97), rgba(14, 5, 7, 0.97));
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img, .brand .mono { width: 38px; height: 38px; flex: none; }
.brand .mono { display: grid; place-items: center; border: 1px solid var(--rule); background: var(--panel-hi); color: var(--title-red); font: 600 20px/1 var(--serif); border-radius: 50%; }
.brand-title { display: block; font: 600 22px/1.1 var(--serif); color: var(--title-red); letter-spacing: 0.02em; white-space: nowrap; }
.brand-sub { display: block; font: 13px/1.2 var(--serif); color: var(--muted); font-variant: small-caps; letter-spacing: 0.06em; }
.spacer { flex: 1; }
.search { position: relative; width: min(340px, 38vw); }
.field {
  width: 100%; font: 14px/1.2 var(--sans); color: var(--text);
  background: #0e1220; border: 1px solid var(--btn-border); border-radius: 2px; padding: 9px 12px;
}
.field::placeholder { color: #7d8396; }
.field:focus-visible { border-color: var(--btn-border-hi); outline-offset: 0; }
.results {
  position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, 86vw); max-height: 60vh; overflow: auto;
  margin: 0; padding: 4px 0; list-style: none; z-index: 40;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
}
.results[hidden] { display: none; }
.results a { display: block; padding: 8px 14px; text-decoration: none; color: var(--body); border-left: 3px solid transparent; }
.results a:hover, .results a[aria-selected="true"] { background: var(--panel-hi); border-left-color: var(--red-hi); }
.r-title { font: 600 15px/1.3 var(--serif); color: var(--text); }
.r-where { font-size: 12px; color: var(--muted); margin-left: 6px; }
.r-snip { display: block; font-size: 13px; color: var(--muted); }
.results mark { background: rgba(200, 50, 60, 0.35); color: var(--text); }
.r-none { padding: 10px 14px; color: var(--muted); font-size: 14px; }

/* Sidebar */
.toc {
  position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto;
  background: linear-gradient(180deg, rgba(23, 7, 9, 0.96), rgba(11, 5, 6, 0.96));
  border-right: 1px solid var(--rule-soft); padding: 12px 0 28px;
}
.app.toc-closed .toc { visibility: hidden; padding: 0; border: 0; }
.label { font: 600 13px/1.2 var(--sans); font-variant: small-caps; letter-spacing: 0.1em; color: var(--muted); text-transform: lowercase; }
.toc > .label { margin: 8px 20px 8px; }
.rolebar .label { display: block; }
.rolebar > span { min-width: 0; }
.rolebar { margin: 2px 14px 12px; padding: 10px 12px; border: 1px solid var(--rule); background: var(--panel-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rolebar b { display: block; font: 600 16px/1.2 var(--serif); color: var(--text); }
.rolebar .btn { flex: none; white-space: nowrap; padding: 7px 10px; font-size: 13px; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.chap-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-left: 3px solid transparent;
  padding: 8px 16px 8px 18px; font: 600 15px/1.3 var(--serif); color: var(--text);
}
.chap-btn:hover { background: var(--panel-hi); }
.chev { width: 10px; flex: none; color: var(--muted); transition: transform 0.15s; }
.chap-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.chap.current > .chap-btn { border-left-color: var(--red); }
.pages { display: none; padding: 0 0 6px; }
.chap-btn[aria-expanded="true"] + .pages { display: block; }
.pages a { display: block; padding: 5px 16px 5px 42px; font-size: 14px; line-height: 1.35; color: var(--muted); text-decoration: none; border-left: 3px solid transparent; }
.pages a:hover { color: var(--text); background: var(--panel-hi); }
.pages a[aria-current="page"] { color: var(--text); border-left-color: var(--red-hi); background: linear-gradient(90deg, rgba(168, 36, 42, 0.45), rgba(168, 36, 42, 0.08)); }

/* Page card */
main { padding: 30px 36px 18px; min-width: 0; }
.crumb { max-width: 800px; margin: 0 auto 10px; display: flex; justify-content: space-between; gap: 12px; }
.card {
  position: relative; max-width: 800px; margin: 0 auto; min-height: 380px; padding: 30px 40px 28px;
  background: linear-gradient(180deg, rgba(31, 9, 12, 0.97), rgba(19, 7, 9, 0.98));
  border: 1px solid var(--rule); border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 18px 40px rgba(0, 0, 0, 0.55);
}
/* Text styles. Titles and button captions centered, body text left, numbers right (as in the game). */
.card h1 { margin: 0 0 4px; text-align: center; font: 600 30px/1.2 var(--serif); color: var(--text); }
.card .lede { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
.rule { height: 1px; border: 0; margin: 14px 0 20px; background: linear-gradient(90deg, transparent, var(--red) 30%, var(--red) 70%, transparent); }
.btn, .role, .pager .ttl { text-align: center; }
.card .num, .card th.num { text-align: right; font-variant-numeric: tabular-nums; }
.card p { margin: 0 0 14px; }
.card ul, .card ol { margin: 0 0 14px; padding-left: 1.3em; }
.card li { margin: 0 0 7px; }
.card li::marker { color: var(--muted); }
.card strong { color: var(--text); }
.card code { font: 0.9em var(--mono); color: var(--code-text); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--rule-soft); border-radius: 2px; padding: 1px 5px; }
.card table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 15px; }
.card th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.card td { padding: 8px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
.card td:first-child { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.grid > div { padding: 11px 13px; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--rule-soft); border-top: 2px solid var(--red); font-size: 14px; color: var(--muted); }
.grid b { display: block; margin-bottom: 3px; font: 600 16px/1.3 var(--serif); color: var(--text); }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid .ok { border-top-color: var(--ok); }
.grid .pend { border-top-color: var(--pend); }
.grid .bad { border-top-color: var(--danger); }
.outline { list-style: none; padding-left: 0 !important; counter-reset: o; }
.outline li { counter-increment: o; position: relative; margin: 0 !important; padding: 8px 10px 8px 40px; border-bottom: 1px solid var(--rule-soft); }
.outline li::before { content: counter(o); position: absolute; left: 12px; top: 8px; font: 600 15px/1.5 var(--serif); color: var(--muted); }
.soon { display: inline-block; vertical-align: middle; margin-left: 10px; padding: 4px 8px; font: 600 12px/1 var(--sans); font-variant: small-caps; letter-spacing: 0.08em; color: var(--gold); border: 1px solid rgba(224, 178, 90, 0.45); border-radius: 2px; }

/* Callout */
.callout { margin: 4px 0 14px; padding: 11px 15px; border: 1px solid var(--rule); border-left: 3px solid var(--red); background: rgba(58, 14, 20, 0.45); font-size: 15px; }
.callout.warn { border-left-color: var(--danger); background: rgba(80, 14, 20, 0.55); }
.callout .label { display: block; margin-bottom: 3px; color: #e07a7f; }
.callout p { margin: 0; }

/* Code */
.code { position: relative; margin: 2px 0 16px; background: var(--code-bg); border: 1px solid var(--rule-soft); border-radius: 2px; }
.code .lang { position: absolute; left: 12px; top: 7px; font: 600 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: #6f6467; }
.code pre { margin: 0; padding: 30px 16px 14px; overflow: auto; font: 13.5px/1.55 var(--mono); color: var(--code-text); tab-size: 4; }
.card .code code { background: none; border: 0; padding: 0; font: inherit; color: inherit; }
.copy { position: absolute; right: 8px; top: 6px; padding: 6px 10px; font-size: 12px; }
.tk-c { color: #7f8b74; font-style: italic; }
.tk-s { color: #d9b48a; }
.tk-k { color: #e07a72; }
.tk-t { color: #9ab8d6; }
.tk-n { color: #c3a3d9; }
.tk-a { color: #d9a85e; }

/* Role choice */
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 4px 0 16px; }
.role {
  cursor: pointer; padding: 16px 16px 14px; color: var(--body);
  background: linear-gradient(180deg, rgba(42, 12, 17, 0.9), rgba(22, 7, 9, 0.9));
  border: 1px solid var(--rule); border-top: 2px solid var(--rule); border-radius: 2px; font: 14px/1.5 var(--sans);
}
.role:hover { border-color: var(--btn-border-hi); }
.role b { display: block; margin-bottom: 6px; font: 600 19px/1.2 var(--serif); color: var(--text); }
.role[aria-pressed="true"] { border-top-color: var(--red-hi); background: linear-gradient(180deg, rgba(120, 24, 30, 0.55), rgba(30, 8, 11, 0.9)); }
.role .go { display: block; margin-top: 10px; color: #b9c9ea; font-weight: 600; font-size: 13px; }

/* Terms, tooltip and glossary */
a.term { color: var(--text); text-decoration: underline dotted rgba(236, 232, 226, 0.55); text-decoration-thickness: 1.5px; text-underline-offset: 4px; cursor: help; }
a.term:hover, a.term:focus-visible { color: #fff; text-decoration-color: var(--red-hi); }
.tip {
  position: fixed; z-index: 50; max-width: 330px; padding: 10px 13px; pointer-events: none;
  background: var(--panel); border: 1px solid var(--rule); border-top: 2px solid var(--red);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7); font-size: 14px; line-height: 1.5; color: var(--body);
}
.tip[hidden] { display: none; }
.tip b { display: block; margin-bottom: 2px; font: 600 15px/1.3 var(--serif); color: var(--text); }
.tip small { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); }
.gl-tools { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.gl-count { white-space: nowrap; font-size: 13px; color: var(--muted); }
.gl-list { margin: 0; max-height: 54vh; overflow: auto; padding-right: 6px; border-top: 1px solid var(--rule-soft); }
.gl-entry { padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--rule-soft); border-left: 3px solid transparent; }
.gl-entry dt { font: 600 17px/1.3 var(--serif); color: var(--text); }
.gl-entry dd { margin: 3px 0 0; font-size: 15px; }
.gl-entry.flash { border-left-color: var(--red-hi); background: var(--panel-hi); }
.gl-entry[hidden] { display: none; }

/* Pager and footer */
.pager { max-width: 800px; margin: 16px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.pager .btn { min-width: 170px; padding: 10px 16px; }
.pager .dir { display: block; margin-bottom: 5px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8e9ab4; }
.pager .ttl { display: block; max-width: 230px; margin: 0 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 15px/1.25 var(--serif); }
.mid { text-align: center; font-size: 13px; color: var(--muted); }
.mid .big { display: block; font: 600 18px/1.2 var(--serif); color: var(--text); font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 300px; margin-top: 6px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: #3a2226; }
.dots span.on { background: var(--gold); }
.foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; padding: 12px 22px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule-soft); background: rgba(10, 5, 6, 0.92); }
.kbd { font: 12px var(--mono); color: var(--text); background: #141a28; border: 1px solid var(--btn-border); border-bottom-width: 2px; border-radius: 2px; padding: 0 5px; }

@media (max-width: 1100px) {
  :root { --sidebar: 240px; }
  main { padding: 24px 20px 16px; }
  .card { padding: 26px 26px 24px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 0 minmax(0, 1fr); }
  .toc { position: fixed; left: 0; width: 280px; z-index: 35; }
  .brand-sub { display: none; }
  .grid, .grid.two, .roles { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<div class="app" id="app">
  <header class="top">
    <button class="btn" id="tocBtn" type="button" aria-controls="toc" aria-expanded="true">&#9776; Contents</button>
    <a class="brand" id="brand" href="#"></a>
    <span class="spacer"></span>
    <div class="search" role="search">
      <label class="sr" for="search">Search this help</label>
      <input class="field" id="search" type="search" placeholder="Search  ( / )" autocomplete="off" aria-controls="results" aria-expanded="false">
      <ul class="results" id="results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
  </header>
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <main id="main" tabindex="-1">
    <div class="crumb"><span class="label" id="crumbLeft"></span></div>
    <article class="card" id="card" aria-live="polite"></article>
    <nav class="pager" aria-label="Page">
      <button class="btn" id="prevBtn" type="button"><span class="dir">&larr; Previous</span><span class="ttl" id="prevTitle"></span></button>
      <div class="mid"><span class="big" id="counter"></span><span id="counterSub"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
      <button class="btn" id="nextBtn" type="button"><span class="dir">Next &rarr;</span><span class="ttl" id="nextTitle"></span></button>
    </nav>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<!-- HELP-CONTENT START -->
<script>
/*
  The Progenitor Help Guide's content. Edit only this block; the renderer around it is copied from
  templates/help/index.html by tools/help-guide/sync.mjs. Page fields: id, title, lede, html,
  code {lang, text}, callout {title, text, warn}, soon. [[term-id|words]] links a glossary term.
  Limits per page: a heading plus about 60 words or 3-5 bullets, one code block, one callout.
  Glossary definitions are one sentence. API names are checked against src/.
*/
window.HELP = {
  id: "progenitor-guide",
  title: "Progenitor",
  subtitle: "Help Guide",

    { id: "players", title: "Players", blurb: "Install mods, join modded servers and change settings." },
    { id: "admins", title: "Server Admins", blurb: "Run Progenitor on a server: join rules, updates, backups." },

  ],
  chapters: [
    {
      id: "start", title: "Welcome", pages: [
        { id: "welcome", title: "What Progenitor is",
          html: `<p>Progenitor is a modding framework for V Rising, loaded through [[bepinex|BepInEx]]. It gives every mod one in-game <strong>Mods</strong> menu: settings, keybinds, installs and updates.</p>
<p>Mods built on it can be swapped into a running game, and undo everything they added when removed.</p>`,
          callout: { title: "Pre-release", text: "No public release yet. Feature status is in <a href=\"https://github.com/VRising-Modders/Progenitor/blob/main/docs/api.md\">docs/api.md</a>." } },
        { id: "choose", title: "Choose your path", chooser: true,
          html: `<p>Pick what you want to do. You can switch at any time from the contents.</p>` }
      ]
    },

    /* ---------------- Players ---------------- */
    {
      id: "players", role: "players", title: "Getting Started", pages: [
        { id: "install-bepinex", title: "Install BepInEx",
          html: `<ol><li>Find the [[game-folder|game folder]]: Steam &rsaquo; right-click <strong>V Rising</strong> &rsaquo; <strong>Manage</strong> &rsaquo; <strong>Browse local files</strong>.</li>
<li>Download <a href="https://thunderstore.io/c/v-rising/p/BepInEx/BepInExPack_V_Rising/">BepInExPack_V_Rising</a> (<strong>Manual Download</strong>) and extract it outside the game folder.</li>
<li>Copy everything inside its <code>BepInExPack_V_Rising</code> folder (<code>BepInEx</code>, <code>dotnet</code>, <code>winhttp.dll</code>, <code>doorstop_config.ini</code> and the rest) into the game folder, next to <code>VRising.exe</code>.</li>
<li>Start the game once. A [[bepinex|BepInEx]] console opens; the first start is slow while it generates its files.</li></ol>` },
        { id: "install", title: "Install Progenitor",
          html: `<ol><li>Download the Progenitor zip and extract it.</li>
<li>Copy its <code>BepInEx</code> folder into the game folder, merging it with the one there.</li>
<li>Start the game. <strong>Mods</strong> appears on the title screen.</li></ol>`,
          callout: { title: "What goes where", text: "<code>BepInEx/plugins/Progenitor.Bootstrap.dll</code>, <code>BepInEx/patchers/Progenitor.Preloader.dll</code> and <code>BepInEx/progenitor-core/</code> (<code>Progenitor.dll</code>, its <code>addresslib</code> tables, this guide). Keep them together; the zip's other files are not needed." } },
        { id: "open", title: "Open the Mods menu",
          html: `<ul><li><strong>Mods</strong> on the title screen.</li><li>The <strong>MODS</strong> tab in the in-game menu.</li><li><span class="kbd">F10</span> anywhere (remappable).</li></ul>
<p>Tabs: <strong>Mods</strong>, <strong>Install Mods</strong>, <strong>Keybinds</strong>, <strong>Preferences</strong>, <strong>Server</strong>.</p>` },
        { id: "mod-page", title: "Every mod's settings are here",
          html: `<p>Every mod built on Progenitor keeps its settings in the Mods menu.</p>
<ul><li><strong>Mods</strong> tab &rsaquo; pick the mod: on/off switch, About, its settings and keys, and <strong>Help</strong> when it has a guide.</li>
<li><strong>Keybinds</strong> tab: every mod's keys and the game's own, remappable; conflicts are marked.</li>
<li>[[server-setting|Server settings]] follow the server while you are on it; only [[admin|admins]] change them. Yours come back when you leave.</li></ul>` },
        { id: "search", title: "Search",
          html: `<p>Each tab's search box covers that tab only:</p>
<ul><li><strong>Mods</strong>: mod names and ids.</li><li><strong>Install Mods</strong>: name, author, description, and the README once loaded.</li>
<li><strong>Keybinds</strong>: action, key, help text and mod name; the game's keys too.</li><li>A mod's settings, when it has more than ten: names, help and section titles.</li></ul>
<p><strong>&times;</strong> or <span class="kbd">Escape</span> clears it; closing the menu empties it.</p>` },
        { id: "features", title: "What Progenitor adds to your game",
          html: `<table><thead><tr><th class="label">Feature</th><th class="label">What it does</th><th class="label">Default</th></tr></thead><tbody>
<tr><td>Build menu search</td><td>A search box over every build tab; tooltips show where an item lives.</td><td>On</td></tr>
<tr><td>Dye all</td><td>Character &rsaquo; Equipment: hold a color swatch to dye every worn piece.</td><td>On</td></tr>
<tr><td>Chat</td><td>A better chat box (next page).</td><td>On</td></tr>
<tr><td>[[photo-mode|Photo mode]]</td><td>A free camera with the HUD hidden: <span class="kbd">Ctrl+Shift+F9</span>.</td><td>Off</td></tr>
<tr><td>Back and forward</td><td>Mouse Back and Forward step through the Mods menu.</td><td>On</td></tr></tbody></table>
<p>Turn each on or off: <strong>Mods &rsaquo; Progenitor</strong>, groups Photo mode, Build menu, Equipment and Chat. Keys: the Keybinds tab.</p>` },
        { id: "chat", title: "Chat",
          html: `<ul><li>Stays up 30 seconds (the game: 14); clicking it doesn't attack.</li>
<li>Tabs, drag to move and resize, history kept per server, &times;3 for repeats, optional timestamps.</li>
<li>Clickable links (asks first), highlighted mentions, right-click a line to copy, whisper or mute.</li>
<li><code>/r</code> replies to the last whisper, <span class="kbd">Tab</span> completes names after <code>/w</code>, <span class="kbd">Up</span> recalls sent lines, <code>.</code> shows the server's commands.</li></ul>
<p>Settings: <strong>Mods &rsaquo; Progenitor &rsaquo; Chat</strong>. A server may turn links or long messages off.</p>` },
        { id: "install-mods", title: "Install mods",
          html: `<p>Open [[install-tab|Install Mods]], find a mod and click <strong>Install</strong>. Some load at once; others ask for a restart.</p>
<ul><li><strong>Simple</strong> (default): one button per mod. <strong>Advanced</strong>: separate Client and Server columns, a server picker and more filters. Switch at the left of the search box.</li>
<li>Click a row to see its <strong>Side</strong>: Client (this game), Server, or Client and server.</li>
<li>Players need only client mods. Server-only mods are listed only for an [[admin|admin]] of the server you are on.</li>
<li>A client and server mod also needs the server to run it; ask its admin. As an admin, Simple can install it on both at once.</li></ul>` },
        { id: "join", title: "Join a modded server",
          html: `<p>On join, the server's message shows, then <strong>Mods for &lt;server&gt;</strong>:</p>
<ul><li><strong>Required to join</strong>: [[required-mod|mods you must have]], with <em>N of M ready</em>.</li>
<li><strong>Recommended</strong>: [[recommended-mod|optional mods]] with the admin's reason.</li>
<li><strong>Install N mods</strong> gets them from Thunderstore, then join or restart and rejoin.</li></ul>` },
        { id: "updates", title: "Updates",
          html: `<p><strong>Preferences &rsaquo; Updates</strong>:</p>
<ul><li><strong>Update mods</strong>: Automatic (default), Notify or Off.</li><li><strong>Offer updates before joining a server</strong>: on by default.</li><li>Per mod, on its page: a different mode, or keep one version.</li></ul>` },
        { id: "help", title: "When something goes wrong",
          html: `<ol><li>Crashed? Start the game again; the last three sessions' logs are kept.</li>
<li><strong>Mods &rsaquo; Progenitor &rsaquo; Get help &rsaquo; Collect logs</strong> saves a zip on your Desktop.</li>
<li>Post it in a bug report or the V Rising Mod Community Discord.</li></ol>`,
          callout: { title: "Before posting", text: "IDs, IPs and known player names are removed, but look through the zip first." } }
      ]
    },

    /* ---------------- Server admins ---------------- */
    {
      id: "admins", role: "admins", title: "Getting Started", pages: [
        { id: "install", title: "Install on a server",
          html: `<ol><li>Copy everything inside <code>BepInExPack_V_Rising</code> into the server folder, next to <code>VRisingServer.exe</code>.</li>
<li>Copy the Progenitor zip's <code>BepInEx</code> folder there too. It is one package for client and server.</li>
<li>Start the server once; the first start is slow while BepInEx generates its files.</li></ol>
<p>A private game hosted from a client loads the client's mods; no separate install.</p>`,
          callout: { title: "Never on a public server", warn: true, text: "<code>Progenitor.Dev.dll</code>, the [[dev-bridge|dev bridge]]. Release packages leave it out." } },
        { id: "admins", title: "Who is an admin",
          html: `<ul><li>Players on the server's admin list, or authenticated with <code>adminauth</code>.</li>
<li>The host of a private game.</li>
<li>All admins are equal: any admin may change any setting.</li>
<li>To stop that, [[config-lock|lock]] groups in the server's <code>progenitor.cfg</code>: <code>[ServerSettings] LockedInGame</code>.</li></ul>` },
        { id: "server-tab", title: "The Server tab",
          html: `<p>Join your server, open <strong>Mods</strong>, then the [[server-tab|Server]] tab. Admins edit; everyone else reads.</p>
<ul><li><strong>Server rules</strong>, join settings, updates and backups.</li><li>Each mod's server settings sit on its own page under <strong>Server settings</strong>.</li></ul>` },
        { id: "join-rules", title: "Client mods for players",
          html: `<p><strong>Server &rsaquo; Mods players need &rsaquo; Players joining</strong>:</p>
<ul><li><strong>Required client mods</strong>, each with a version rule.</li><li><strong>Recommended client mods</strong>, with a reason.</li>
<li><strong>Which client mods players may use</strong>: Any mods, or Only approved mods.</li><li>The server message players see first.</li></ul>`,
          callout: { title: "House rules, not anti-cheat", text: "Players' games report their own mods." } },
        { id: "chat-rules", title: "Chat and photo mode",
          html: `<p><strong>Server &rsaquo; Chat</strong>, for everyone on the server:</p>
<ul><li>Allow clickable links, mod links, <code>@all</code> from admins and long messages (all on).</li>
<li>A word filter: replace with <code>***</code> or block the line (off).</li>
<li>A Discord relay of chosen channels to a webhook (off).</li></ul>
<p><strong>Mods &rsaquo; Progenitor &rsaquo; On this server</strong>: allow [[photo-mode|photo mode]] (on).</p>`,
          callout: { title: "Not yet verified in game", text: "The server chat settings are tested outside the game only." } },
        { id: "remote-install", title: "Install mods on the server",
          html: `<p>Joined as an admin, [[remote-install|Install Mods]] can also install, update and remove mods on that server. A mod that cannot load live waits for the next server start.</p>` },
        { id: "updates", title: "Updates",
          html: `<p><strong>Server &rsaquo; Updates</strong>:</p>
<ul><li><strong>Update server mods</strong>: Notify (default), Automatic or Off.</li><li><strong>Check every (hours)</strong>: 6.</li>
<li><strong>Restart when empty</strong> and <strong>Back up the world before updating</strong>: off by default.</li></ul>` },
        { id: "backups", title: "Backups and restores",
          html: `<p><strong>Server &rsaquo; Server rules</strong>:</p>
<ul><li><strong>Back up the world now</strong>, or on a schedule.</li><li><strong>Restore an earlier world</strong>: a backup or a wipe archive, put back at the next start. The current world is backed up first.</li></ul>`,
          callout: { title: "Not yet", text: "Restores in a hosted private game." } },
        { id: "help", title: "When something goes wrong",
          html: `<ul><li><code>.progenitor logs</code> in chat collects the server's logs.</li>
<li>A world saved with a content mod still loads after that mod is removed (<code>[SaveSafety]</code> in <code>progenitor.cfg</code>).</li>
<li>Bugs: a GitHub bug report or the V Rising Mod Community Discord.</li></ul>` }
      ]
    },

    /* ---------------- Mod developers ---------------- */
    {
      id: "developers", role: "developers", title: "Getting Started", pages: [
        { id: "what-you-get", title: "What you get",
          html: `<div class="grid"><div><b>Settings</b>Player and server settings, with reset and sync.</div><div><b>Keybinds</b>Remappable, in the Keybinds tab.</div><div><b>Windows</b>Game-look windows, placed for you.</div>
<div><b>Hot reload</b>Rebuild and swap into the running game.</div><div><b>Networking</b>Typed client-server requests.</div><div><b>Mods page</b>Status, version, About, settings.</div></div>
<p>Everything goes through [[ctx|<code>ctx</code>]]; unload undoes it.</p>` },
        { id: "requirements", title: "What you need",
          html: `<ul><li>V Rising and <strong>BepInExPack_V_Rising</strong>. Start the game once to create <code>BepInEx\\interop</code>.</li>
<li><strong>Progenitor</strong>, in the same BepInEx folder.</li><li><strong>.NET 8 SDK</strong> and an editor.</li></ul>`,
          callout: { title: "Game elsewhere?", text: "Set <code>VRISING_GAME_DIR</code>. See the README, Building from source." } },
        { id: "folders", title: "Where the files go",
          html: `<table><thead><tr><th class="label">Folder</th><th class="label">Holds</th></tr></thead><tbody>
<tr><td><code>BepInEx/plugins/</code></td><td>[[bootstrap|Bootstrap]] only</td></tr>
<tr><td><code>BepInEx/progenitor-core/</code></td><td>[[core|Core]], <code>Progenitor.dll</code></td></tr>
<tr><td><code>BepInEx/progenitor-reload/</code></td><td><strong>Your mod</strong> (the [[reload-folder|reload folder]])</td></tr></tbody></table>` },
        { id: "create-mod", title: "Create your first mod",
          html: `<p>Recommended: the starter template. It sets up the build, plugin class, a setting, a keybind and a help page.</p>{{code}}`,
          code: { lang: "shell", text: `dotnet new progenitor-mod -n MyMod
cd MyMod
dotnet build` },
          callout: { title: "Template not found?", text: "It is new. Build it by hand from the next two pages." } },
        { id: "project-file", title: "The project file",
          html: `<p>Inside the Progenitor repository, beside the samples:</p>{{code}}<p>Outside it, copy the game references from <code>Directory.Build.targets</code> and <code>.props</code>.</p>`,
          code: { lang: "xml", text: `<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <AssemblyName>MyMod</AssemblyName>
    <BepInExPluginGuid>com.example.mymod</BepInExPluginGuid>
    <BepInExPluginName>My Mod</BepInExPluginName>
    <ReferenceGame>true</ReferenceGame>
  </PropertyGroup>
  <ItemGroup>
    <ProjectReference Include="..\\..\\src\\Progenitor.Core\\Progenitor.Core.csproj" Private="false" />
  </ItemGroup>
</Project>` } },
        { id: "plugin-class", title: "The plugin class",
          code: { lang: "c#", text: `[BepInPlugin(MyPluginInfo.PLUGIN_GUID, MyPluginInfo.PLUGIN_NAME, MyPluginInfo.PLUGIN_VERSION)]
[BepInDependency("progenitor")]
[ProgenitorSide(Side.Both)]
public sealed class Plugin : ProgenitorPlugin<MyContext>
{
    protected override void OnLoad(MyContext ctx)
    {
        ctx.Handshake.DeclareSelf();
        if (ctx.IsServer)
            ctx.Events.On<PlayerConnected>(e => ctx.Log.LogInfo("Welcome, " + e.CharacterName));
    }
}

public sealed class MyContext : PluginContext { }` },
          callout: { title: "Keep the context constructor empty", warn: true, text: "Facades attach after it runs. Set up in <code>OnLoad</code>." } },
        { id: "build-reload", title: "Build and hot-reload it",
          html: `<ol><li>Host a private game; it shares the client's BepInEx folder.</li>
<li><code>dotnet build</code>, then copy <code>bin\\Debug\\net6.0\\MyMod.dll</code> to <code>BepInEx\\progenitor-reload\\</code>.</li>
<li>Change, build, copy. The old version unloads; the new one loads.</li></ol>
<p>In the repository: build, then <code>tools/deploy.ps1 -Projects MyMod -Side server -NoBuild</code>.</p>`,
          callout: { title: "Bootstrap changes", text: "Need a restart. See the <a href=\"https://github.com/VRising-Modders/Progenitor/blob/main/docs/hot-reload.md\">hot-reload guide</a>." } },
        { id: "check-reload", title: "Check that it loaded",
          html: `<ul><li><strong>Log:</strong> <code>Reload:</code> lines in <code>BepInEx\\LogOutput.log</code> name the [[unload-reason|reason]].</li>
<li><strong>Behavior:</strong> use what you changed.</li><li><strong>Still old?</strong> Not settled yet, or refused; the log says which.</li></ul>` },
        { id: "add-setting", title: "Add a setting",
          code: { lang: "c#", text: `var showHints = ctx.Config.Bind("General", "ShowHints", true,
    "Show a hint when the window opens.");

ctx.Settings.Page(page => page
    .Section("General")
        .Toggle(showHints));` },
          html: `{{code}}<ul><li>The row shows on your Mods page, with reset and help.</li><li><strong>Pick defaults that work</strong>; most players never open settings.</li><li>One <code>Page</code> call holds all rows.</li></ul>` },
        { id: "server-settings", title: "Player and server settings",
          html: `<p>Player settings change one game. Server settings apply to everyone: bind them [[synced-setting|synced]] and admins edit them in game.</p>{{code}}<p>Non-admins see server rows read-only.</p>`,
          code: { lang: "c#", text: `var maxStack = ctx.Bind("Server", "MaxStack", 99, "Largest stack.",
    synced: true, acceptableValues: new AcceptableValueRange<int>(1, 999));

ctx.Settings.Page(page => page
    .Section("General").Toggle(showHints)
    .Section("Server").Slider(maxStack, scope: SettingScope.Server));` } },
        { id: "add-keybind", title: "Add a keybind",
          code: { lang: "c#", text: `ctx.Keybinds.RegisterOpener("ToggleWindow", new KeyChord(UiKey.F8),
    "Open or close the My Mod window.", ToggleWindow);` },
          html: `{{code}}<ul><li><code>RegisterOpener</code>: opens or closes your UI; works at the title screen too.</li><li><code>Register</code>: acts in the world.</li><li>Both are [[keybind|remappable]] in the Keybinds tab.</li></ul>`,
          callout: { title: "Never read keys yourself", warn: true, text: "No <code>UnityEngine.Input</code>, <code>Keyboard.current</code> or gamepad polling." } },
        { id: "show-window", title: "Show a window",
          code: { lang: "c#", text: `var window = ctx.Windows.Create(UiWindowPreset.Basic, "My Mod");
var panel = window.Panel;
panel.Text("Status", UiTextStyle.Section);
panel.Text("Version", ctx.Version, UiTextStyle.Number);
panel.Button("Close").OnClick(window.Hide);
window.Show();` },
          html: `{{code}}<ul><li>Pick a [[window-preset|preset]]: <code>Basic</code> for a small tool, <code>Header</code> for one thing the player works on (toolbar, tabs), <code>Tabbed</code> for a large screen.</li><li>The window draws its frame, centered title and version stamp, and closes on unload.</li><li>Every line takes a [[text-style|text style]].</li></ul>` },
        { id: "where-ui-lives", title: "Windows and pages",
          html: `<table><thead><tr><th class="label">Need</th><th class="label">Use</th></tr></thead><tbody>
<tr><td>Options set once</td><td><code>ctx.Settings.Page(...)</code></td></tr>
<tr><td>A screen of its own</td><td><code>ctx.Menu.Register(name, description).Page(title, ...)</code></td></tr>
<tr><td>A window during play</td><td>[[window-preset|<code>ctx.Windows.Create</code>]]: <code>Basic</code>, <code>Header</code> or <code>Tabbed</code></td></tr>
<tr><td>Too much for one page</td><td>[[tabs|<code>Tabs</code>]]</td></tr>
<tr><td>A question</td><td>[[dialog|<code>ctx.Dialogs</code>]]: <code>Confirm</code>, <code>Notice</code>, <code>Choose</code>, <code>Prompt</code></td></tr></tbody></table>
<p>Text: <code>panel.Text(text, UiTextStyle.Body)</code> and the other styles. Layout: <code>Divider</code>, <code>Fact</code>, <code>Info</code>, <code>BeginInline()</code>/<code>EndInline()</code>. See each one live in the [[gallery|Gallery]].</p>`,
          callout: { title: "Fonts, colors and alignment", warn: true, text: "This is where AI-built UIs usually go wrong. Give every line a named <a href=\"https://github.com/VRising-Modders/Progenitor/blob/main/docs/ui-controls.md#text-styles\">text style</a>; never set a color, size, font or alignment. Numbers right, text left, button captions and titles centered. Check every label in the game before calling a window done." } },
        { id: "controls", title: "The controls, by category",
          html: `<table><thead><tr><th class="label">Category</th><th class="label">Controls</th></tr></thead><tbody>
<tr><td>Layout and windows</td><td>[[window-preset|<code>ctx.Windows.Create</code>]], [[text-style|<code>panel.Text</code>]], <code>Divider</code>, <code>BeginInline</code>, [[tabs|<code>Tabs</code>]]</td></tr>
<tr><td>Input</td><td><code>Button</code>, <code>ConfirmButton</code>, <code>Toggle</code>, [[dropdown-radio|<code>Dropdown</code>, <code>Radio</code>]], <code>MultiSelect</code>, [[slider|<code>Slider</code>, <code>SliderField</code>, <code>Number</code>]], <code>Input</code>, <code>TextArea</code>, <code>ColorField</code>, <code>DateTimeField</code>, [[key-field|<code>KeyField</code>]], <code>CodeArea</code></td></tr>
<tr><td>Lists and data</td><td>[[ordered-list|<code>OrderedList</code>]], [[picker|<code>Picker</code>]], [[data-table|<code>DataTable</code>]], [[master-detail|<code>MasterDetail</code>]], [[chips|<code>Chips</code>]]</td></tr>
<tr><td>Feedback</td><td>[[tooltip|<code>Tooltip</code>]], [[term-tooltip|<code>Term</code>]], [[tip-card|<code>ctx.Hud.Tip</code>]], <code>ctx.Dialogs</code>, <code>ctx.Hud.Notify</code>, <code>Label(text, tone)</code></td></tr>
<tr><td>HUD and world</td><td>[[locate|<code>ctx.Hud.Locate</code>]], [[pick-in-world|<code>ctx.Hud.PickInWorld</code>]]</td></tr>
<tr><td>Game panels</td><td>[[vanilla-attach|<code>Ui.AttachToVanilla</code>]]</td></tr></tbody></table>
<p>Catalog, with each control's text style: <a href="https://github.com/VRising-Modders/Progenitor/blob/main/docs/ui-controls.md">docs/ui-controls.md</a>. In game: the controls sample's [[gallery|Gallery]]. Choosing: <a href="https://github.com/VRising-Modders/Progenitor/blob/main/docs/ui-style.md">UI style guide</a>.</p>` },
        { id: "messages", title: "Messages to players",
          html: `<p>Write the message alone, one sentence: the [[message-prefix|prefix]] makes it <code>&lt;Mod Name&gt;: &lt;message&gt;</code>. Client [[notice|notice]]: <code>ctx.Hud.Notify(text, detail, kind)</code>. Server chat: <code>ctx.Chat.SendTo(user, text)</code>. Command reply: <code>Reply(text)</code>.</p>
<div class="grid two"><div><b>Info</b>Something happened (default).</div><div class="ok"><b>Success</b>An action finished.</div><div class="pend"><b>Warning</b>Worth a look.</div><div class="bad"><b>Error</b>Something failed.</div></div>`,
          callout: { title: "Player must act?", text: "Use <code>ctx.Dialogs</code>. <code>Notify</code> is tested, not yet verified live." } },
        { id: "mods-page", title: "Your Mods page",
          html: `<p>About text, first found wins:</p><ol><li>the installed Thunderstore package's README;</li><li>an embedded <code>README.md</code>;</li><li>[[mod-about|<code>[ModAbout("...")]</code>]];</li><li>the <code>ctx.Menu.Register</code> description.</li></ol>
<p>Version: from <code>[BepInPlugin]</code>, <code>1.2.0</code> form, same as <code>manifest.json</code>. Example: <code>samples/Progenitor.AboutExample</code>.</p>` },
        { id: "help-page", title: "Your help page",
          html: `<p>Give players a help page like this one: copy <code>templates/help/index.html</code> into your mod as <code>help/index.html</code> and edit its content block (<a href="https://github.com/VRising-Modders/Progenitor/blob/main/templates/help/README.md">how</a>). The starter template has one.</p>{{code}}<p>Your Mods page then shows a <strong>Help</strong> button that opens it (<a href="https://github.com/VRising-Modders/Progenitor/blob/main/docs/mod-settings.md#help-button">Help button</a>).</p>`,
          code: { lang: "xml", text: `<EmbeddedResource Include="help\\**"
    LogicalName="help/%(RecursiveDir)%(Filename)%(Extension)" />` } },
        { id: "ai-assistant", title: "Using an AI assistant",
          html: `<p>Start the conversation with:</p>{{code}}<ul><li>Guide: <a href="https://github.com/VRising-Modders/Progenitor/blob/main/PROGENITOR_GUIDE.md">PROGENITOR_GUIDE.md</a>. Deeper: <code>docs/modules.md</code>, <a href="https://github.com/VRising-Modders/Progenitor/blob/main/knowledge/README.md">knowledge notes</a>.</li>
<li>The [[dev-bridge|dev bridge]] lets it build, reload and inspect your mod in a test game.</li></ul>`,
          code: { lang: "prompt", text: `We are making a V Rising mod with Progenitor. Follow PROGENITOR_GUIDE.md
(repo root). The mod is: <describe it>.` } },
        { id: "next-steps", title: "Next steps",

    { id: "glossary", title: "Glossary", pages: [ { id: "terms", title: "Glossary", lede: "Hover an underlined word anywhere to see its entry.", glossary: true } ] }
  ],
  glossary: [
    { id: "progenitor", term: "Progenitor", def: "A V Rising modding framework that gives mods settings, keybinds, UI, networking and hot reload, and undoes their registrations on unload." },
    { id: "game-folder", term: "Game folder", def: "The V Rising install folder that holds <code>VRising.exe</code>; BepInEx and Progenitor go inside it." },
    { id: "server-setting", term: "Server setting", def: "A mod setting the server decides for everyone on it; while you are joined it shows the server's value, which only admins change." },
    { id: "photo-mode", term: "Photo mode", def: "Progenitor's free-flying camera with the HUD hidden, off by default; a server can disallow it." },
    { id: "install-tab", term: "Install Mods tab", def: "The Mods menu tab that lists Thunderstore mods and installs, updates or removes them in game." },
    { id: "server-tab", term: "Server tab", def: "The Mods menu tab for how the joined server is set up: rules, join settings, updates and backups; admins edit, everyone else reads." },
    { id: "required-mod", term: "Required client mod", def: "A client mod a server needs every player to have before they can join." },
    { id: "recommended-mod", term: "Recommended client mod", def: "A client mod a server suggests with a reason; players may skip it." },
    { id: "admin", term: "Admin", def: "A player on the server's admin list or authenticated with <code>adminauth</code> (or the host of a private game); every admin may change everything." },
    { id: "config-lock", term: "Config lock", def: "<code>[ServerSettings] LockedInGame</code> in the server's <code>progenitor.cfg</code>: groups of settings no admin can change in game." },
    { id: "remote-install", term: "Remote install", def: "An admin installing, updating or removing mods on the joined server from their own Install Mods tab." },
    { id: "restore-point", term: "Restore point", def: "A world backup or wipe archive an admin can put back; the restore runs at the next server start and backs up the current world first." },
    { id: "bepinex", term: "BepInEx", def: "The plugin loader V Rising mods run on, installed as BepInExPack_V_Rising." },
    { id: "plugin", term: "Plugin", def: "A mod's DLL and main class, which subclasses <code>ProgenitorPlugin&lt;TContext&gt;</code> and registers its work in <code>OnLoad</code>." },
    { id: "core", term: "Core", def: "<code>Progenitor.dll</code> in <code>BepInEx/progenitor-core</code>, the framework itself, which can be swapped while the game runs." },
    { id: "bootstrap", term: "Bootstrap", def: "<code>Progenitor.Bootstrap.dll</code> in <code>BepInEx/plugins</code>, loaded once per process to load Core; changing it needs a restart." },
    { id: "generation", term: "Generation", def: "One loaded copy of Core or a plugin; each hot reload makes a new one, and static fields do not carry over." },
    { id: "hot-reload", term: "Hot reload", def: "Replacing a mod or Core in the running game: the old version unloads and the new one loads, with no restart." },
    { id: "reload-folder", term: "Reload folder", def: "<code>BepInEx/progenitor-reload/</code>, checked once a second; each DLL there is loaded, and reloaded when it changes." },
    { id: "ctx", term: "ctx (plugin context)", def: "The object passed to <code>OnLoad</code> through which every registration goes, so unload can reverse it." },
    { id: "unload-reason", term: "Unload reason", def: "Why a plugin unloads (<code>Swap</code>, <code>Removal</code>, <code>Shutdown</code>, <code>Unknown</code>); only <code>Removal</code> should sweep saved state." },
    { id: "keybind", term: "Keybind", def: "A key registered with <code>ctx.Keybinds</code>, shown in the Keybinds tab, remappable and conflict-checked." },
    { id: "mod-settings", term: "Mod settings (player and server)", def: "Player settings change one player's game; server settings belong to the server and apply to everyone on it." },
    { id: "synced-setting", term: "Synced setting", def: "An entry bound with <code>ctx.Bind(..., synced: true)</code> whose server value is sent to clients for the session." },
    { id: "sides", term: "Server part and client part", def: "The same mod DLL loaded on the server and on each client; <code>ctx.IsServer</code> and <code>ctx.IsClient</code> tell them apart." },
    { id: "handshake", term: "Handshake", def: "The join-time check where client and server compare mods and versions, so a missing required mod gets a clear message." },
    { id: "network-compatibility", term: "NetworkCompatibility", def: "A plugin attribute saying whether the other side must have the mod and how versions must match." },
    { id: "counterpart", term: "Counterpart", def: "The other side's part of a mod; <code>[Counterpart]</code> says how much still works without it." },
    { id: "mod-about", term: "ModAbout", def: "An attribute holding the Markdown your Mods page shows under About when there is no README." },
    { id: "mods-page", term: "Mods page", def: "A mod's page in the in-game Mods menu: status bar, header, About text, settings, keybinds and custom pages." },
    { id: "workspace", term: "Workspace", def: "The in-game Mods menu screen (title screen or Escape menu) with the mod list and the Install, Keybinds and Preferences tabs." },
    { id: "window-preset", term: "Window preset", def: "<code>ctx.Windows.Create(UiWindowPreset.Basic | Header | Tabbed, title)</code>: a standard window with the game's frame, a centered title and a version stamp." },
    { id: "text-style", term: "Text style", def: "<code>panel.Text(text, UiTextStyle.X)</code>: Title, Section, Body, Muted, Number, Warning, Error or Success; it fixes the font, size, color and alignment." },
    { id: "gallery", term: "Gallery", def: "A page of the controls sample (Ctrl+F7, then Gallery) that shows every control, window preset and text style live." },
    { id: "message-prefix", term: "Message prefix", def: "<code>&lt;Mod Name&gt;: </code>, added by Progenitor in front of notices, chat messages and command replies; <code>prefix: false</code> turns it off." },
    { id: "panel", term: "Panel", def: "A floating window made with <code>Ui.Panel(...)</code> that the framework sizes and places; use a window preset unless none fits." },
    { id: "game-window", term: "GameWindow", def: "<code>panel.GameWindow()</code>: the game's popup frame for a plain panel, when no window preset fits; call it before adding controls." },
    { id: "widget", term: "Widget", def: "A composed UI kit control such as <code>Tabs</code>, <code>DataTable</code>, <code>Picker</code>, <code>OrderedList</code>, <code>MasterDetail</code> or <code>Chips</code>." },
    { id: "tabs", term: "Tabs", def: "Two to five short captions that switch groups of controls: <code>panel.Tabs(key, captions)</code>." },
    { id: "dropdown-radio", term: "Dropdown / Radio", def: "Pick one option: a radio shows two to four short ones together, a dropdown holds many or long ones." },
    { id: "slider", term: "Slider / SliderField / Number", def: "Number controls: rough amount, range plus exact box, or a small stepped count." },
    { id: "key-field", term: "KeyField", def: "A key-capture control for a bind registered with <code>ctx.Keybinds</code>." },
    { id: "ordered-list", term: "OrderedList", def: "A list the player arranges, such as a priority order, by dragging or arrows." },
    { id: "picker", term: "Picker", def: "Choose one or several of many named things (items, chests, players) with search; unpickable ones are grayed with a reason." },
    { id: "data-table", term: "DataTable", def: "Many records the player sorts, filters, selects and edits." },
    { id: "master-detail", term: "MasterDetail", def: "A searchable list of named sets on the left, the selected one's editor on the right." },
    { id: "chips", term: "Chips", def: "A few short values the player adds and removes, such as members, tags or filters." },
    { id: "tooltip", term: "Tooltip", def: "Extra detail shown on hover; the control's name must still stand alone." },
    { id: "term-tooltip", term: "Term tooltip", def: "A mod's own word, defined with <code>UiTerms.Define</code> and marked with <code>handle.Term(term)</code>, explained on hover." },
    { id: "tip-card", term: "Tip card", def: "A one-time explanation of a screen, shown the first time it opens: <code>ctx.Hud.Tip</code>." },
    { id: "dialog", term: "Dialog", def: "The game's modal popup for a question: <code>ctx.Dialogs.Confirm</code>, <code>Notice</code>, <code>Choose</code>, <code>Prompt</code>." },
    { id: "notice", term: "Notice", def: "A short banner message from <code>ctx.Hud.Notify</code>, of kind Info, Success, Warning or Error." },
    { id: "locate", term: "Locate", def: "<code>ctx.Hud.Locate</code>: a marker and edge arrow showing where something is for a few seconds." },
    { id: "pick-in-world", term: "Pick in world", def: "<code>ctx.Hud.PickInWorld</code>: the player chooses a chest or station by interacting with it; Escape cancels." },
    { id: "vanilla-attach", term: "Game-panel attachment", def: "<code>Ui.AttachToVanilla(site, anchor, ...)</code>: a button or line on a game panel such as a chest, station, inventory, castle heart or item tooltip." },
    { id: "requests", term: "Requests / Subscriptions", def: "<code>ctx.Requests</code> sends a typed client request the server answers or refuses; <code>ctx.Subscriptions</code> follows a server topic's updates." },
    { id: "material-source", term: "MaterialSource", def: "<code>ctx.MaterialSource</code>: one experimental server provider deciding where build and craft materials come from." },

    { id: "castle-heart", term: "Castle heart", def: "The structure that claims a territory and keeps a castle running." },
    { id: "world-epoch", term: "World epoch", def: "A stamp of the current world load; keep it beside any held entity and check <code>ctx.WorldState.IsStale</code>." },
    { id: "thunderstore", term: "Thunderstore", def: "The mod site the Install Mods tab installs from; Progenitor publishes there as <code>VRising_Modders-Progenitor</code>." },

    { id: "game-free-test", term: "Game-free test", def: "A test that runs with <code>dotnet test</code> and no game install, as CI does." }
  ]
};

<script>
/* Renderer: shared by every Progenitor help page. Edit templates/help/index.html, then run tools/help-guide/sync.mjs. */
(function () {
  "use strict";

    });

  });
  var gloss = {};
  (H.glossary || []).forEach(function (g) { gloss[g.id] = g; });
  var roleById = {};

  if (role && !roleById[role]) role = null;

  function path() {
    return pages.filter(function (p) { return !p.chapter.role || p.chapter.role === role; });
  }
  function firstPageOfRole(r) {
    for (var i = 0; i < pages.length; i++) if (pages[i].chapter.role === r) return pages[i];
    return pages[0];
  }
  function chooserPage() {
    for (var i = 0; i < pages.length; i++) if (pages[i].data.chooser) return pages[i];

  // ---- Rendering helpers ----
  var KW = {};
  ("using namespace public private protected internal sealed static readonly class struct interface enum new return if else var void bool int string double float true false null this override abstract virtual async await foreach for in is as get set out ref const typeof").split(" ").forEach(function (k) { KW[k] = 1; });
  function tintCs(src) {
    var re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|(\[[A-Z][A-Za-z]*(?=[(\]]))|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g, out = "", last = 0, m;

      else if (m[2]) out += '<span class="tk-s">' + esc(t) + "</span>";
      else if (m[3]) out += '[<span class="tk-a">' + esc(t.slice(1)) + "</span>";
      else if (m[4]) out += '<span class="tk-n">' + t + "</span>";
      else if (KW[t]) out += '<span class="tk-k">' + t + "</span>";
      else if (/^[A-Z]/.test(t)) out += '<span class="tk-t">' + t + "</span>";

  }
  function tint(lang, src) {

  function renderPage(page) {

        (H.glossary || []).map(function (g) {

  // ---- Sidebar ----
  var toc = $("toc"), app = $("app"), tocBtn = $("tocBtn");
  function renderToc(current) {
    var h = "";

      h += '<div class="rolebar"><span><span class="label">Your path</span><b>' + esc(roleById[role].title) + '</b></span><button class="btn" type="button" id="switchRole">Switch role</button></div>';
    }
    h += '<div class="label">Chapters</div><ol>';
    var seen = {};
    path().forEach(function (p) {
      var ch = p.chapter;
      if (seen[ch.id]) return;
      seen[ch.id] = 1;
      var isCur = current && current.chapter === ch;
      h += '<li class="chap' + (isCur ? " current" : "") + '"><button type="button" class="chap-btn" data-chapter="' + esc(ch.id) + '" aria-expanded="' + isCur + '"><span class="chev" aria-hidden="true">&#9656;</span>' + esc(ch.title) + '</button><ol class="pages">' +
        ch.pages.map(function (q, i) {
          return '<li><a href="#' + q.key + '"' + (q === current ? ' aria-current="page"' : "") + ">" + (ch.pages.length > 1 ? (i + 1) + ". " : "") + esc(q.title) + "</a></li>";
        }).join("") + "</ol></li>";
    });
    toc.innerHTML = h + "</ol>";
    var cur = toc.querySelector('[aria-current="page"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }
  toc.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "switchRole") { var c = chooserPage(); if (c) go(c.key); return; }
    if (b.classList.contains("chap-btn")) {
      var open = b.getAttribute("aria-expanded") === "true";
      b.setAttribute("aria-expanded", open ? "false" : "true");
    }
  });
  function setToc(open) { app.classList.toggle("toc-closed", !open); tocBtn.setAttribute("aria-expanded", String(open)); }
  if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) setToc(false);
  tocBtn.addEventListener("click", function () { setToc(app.classList.contains("toc-closed")); });

  // ---- Navigation ----
  var current = null, card = $("card"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");
  function setRole(r) { role = r; store(":role", r); }
  function show(page) {
    if (!page) page = pages[0];
    if (hasRoles && page.chapter.role && page.chapter.role !== role) setRole(page.chapter.role);
    current = page;
    card.innerHTML = renderPage(page);
    wireCard();
    var ch = page.chapter, list = path(), i = list.indexOf(page);
    document.title = page.title + " · " + (H.title || "Help");
    $("crumbLeft").textContent = (hasRoles && role && ch.role ? roleById[role].title + " · " : "") + ch.title;
    var inCh = ch.pages.indexOf(page);
    $("counter").textContent = (inCh + 1) + " / " + ch.pages.length;
    $("counterSub").textContent = ch.title;
    $("dots").innerHTML = ch.pages.length > 1 ? ch.pages.map(function (q) { return q === page ? '<span class="on"></span>' : "<span></span>"; }).join("") : "";
    var prev = list[i - 1], next = list[i + 1];
    var blocked = hasRoles && !role && page.data.chooser;
    prevBtn.disabled = !prev; nextBtn.disabled = !next || blocked;
    $("prevTitle").textContent = prev ? prev.title : "Start";
    $("nextTitle").textContent = blocked ? "Choose a path" : next ? next.title : "End";

  function parseHash(h) {
    h = decodeURIComponent((h || "").replace(/^#/, ""));
    var c = h.indexOf(":");
    return c > -1 ? { key: h.slice(0, c), term: h.slice(c + 1) } : { key: h, term: null };
  }
  function go(key, term) {
    var target = "#" + key + (term ? ":" + term : "");

  }
  function route(r) {

    if (!page) { var ch = chapters.filter(function (c) { return c.id === r.key; })[0]; page = ch && ch.pages[0]; }
    show(page || pages[0]);
    if (r.term) flashTerm(r.term);
  }
  prevBtn.addEventListener("click", function () { var l = path(), i = l.indexOf(current); if (l[i - 1]) go(l[i - 1].key); });
  nextBtn.addEventListener("click", function () { var l = path(), i = l.indexOf(current); if (l[i + 1]) go(l[i + 1].key); });
  window.addEventListener("hashchange", function () { route(); });
  window.addEventListener("popstate", function () { route(); });
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
      var r = parseHash(a.getAttribute("href"));

  });

  // ---- Per-page wiring: copy buttons, role cards, glossary, terms ----

    });

    if (gs) { gs.addEventListener("input", filterGlossary); filterGlossary(); }
    Array.prototype.forEach.call(card.querySelectorAll("a.term"), function (a) {
      a.addEventListener("mouseenter", function () { showTip(a); });
      a.addEventListener("mouseleave", hideTip);
      a.addEventListener("focus", function () { showTip(a); });
      a.addEventListener("blur", hideTip);
    });
  }
  function filterGlossary() {
    var gs = $("glSearch"), q = gs.value.trim().toLowerCase(), n = 0, all = card.querySelectorAll(".gl-entry");
    Array.prototype.forEach.call(all, function (el) { var hit = !q || el.textContent.toLowerCase().indexOf(q) > -1; el.hidden = !hit; if (hit) n++; });
    $("glCount").textContent = q ? n + " of " + all.length + " terms" : all.length + " terms";
  }
  function flashTerm(id) {
    var el = $("term-" + id), list = $("glList");
    if (!el || !list) return;
    el.classList.add("flash");
    list.scrollTop = el.offsetTop - list.offsetTop - 8;
  }
  var tip = $("tip"), tipFor = null;
  function showTip(a) {
    var g = gloss[a.dataset.term];
    if (!g) return;

    tip.innerHTML = "<b>" + esc(g.term) + "</b>" + g.def + "<small>Click for the glossary.</small>";

  }
  function hideTip() { if (tipFor) tipFor.removeAttribute("aria-describedby"); tipFor = null; tip.hidden = true; }
  window.addEventListener("scroll", hideTip, { passive: true });

  // ---- Search across every page ----
  var search = $("search"), results = $("results"), active = -1;
  var index = pages.map(function (p) {
    var d = p.data, text = plain((d.lede || "") + " " + (d.html || "") + " " + (d.callout ? d.callout.title + " " + d.callout.text : "")) + " " + (d.code ? d.code.text : "");
    if (d.glossary) text += " " + (H.glossary || []).map(function (g) { return g.term + " " + plain(g.def); }).join(" ");
    return { page: p, text: text.replace(/\s+/g, " ").trim() };
  });
  function closeResults() { results.hidden = true; active = -1; search.setAttribute("aria-expanded", "false"); }
  function mark(s, q) { var i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)); }
  function runSearch() {
    var q = search.value.trim().toLowerCase();
    if (q.length < 2) { closeResults(); return; }
    var words = q.split(/\s+/);
    var hits = index.map(function (row) {
      var t = row.page.title.toLowerCase(), x = row.text.toLowerCase(), s = 0;
      for (var i = 0; i < words.length; i++) { if (t.indexOf(words[i]) > -1) s += 10; else if (x.indexOf(words[i]) > -1) s += 1; else return null; }
      return { row: row, s: s };
    }).filter(Boolean).sort(function (a, b) { return b.s - a.s; }).slice(0, 12);
    results.innerHTML = hits.length ? hits.map(function (h, i) {
      var p = h.row.page, x = h.row.text.toLowerCase().indexOf(words[0]);
      var snip = x > -1 ? h.row.text.slice(Math.max(0, x - 40), x + 90) : h.row.text.slice(0, 120);
      var where = (p.chapter.role && roleById[p.chapter.role] ? roleById[p.chapter.role].title + " · " : "") + p.chapter.title;
      return '<li><a role="option" id="res-' + i + '" href="#' + p.key + '"><span class="r-title">' + mark(p.title, words[0]) + '</span><span class="r-where">' + esc(where) + '</span><span class="r-snip">' + (x > 40 ? "…" : "") + mark(snip, words[0]) + "…</span></a></li>";
    }).join("") : '<li class="r-none">Nothing matches.</li>';
    results.hidden = false; active = -1; search.setAttribute("aria-expanded", "true");
  }
  function move(d) {
    var links = results.querySelectorAll("a");
    if (!links.length) return;
    active = (active + d + links.length) % links.length;
    Array.prototype.forEach.call(links, function (a, i) { a.setAttribute("aria-selected", String(i === active)); });
    search.setAttribute("aria-activedescendant", links[active].id);
    links[active].scrollIntoView({ block: "nearest" });
  }
  search.addEventListener("input", runSearch);
  search.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") {
      var links = results.querySelectorAll("a"), a = links[active > -1 ? active : 0];
      if (a) { e.preventDefault(); closeResults(); search.blur(); go(parseHash(a.getAttribute("href")).key); }
    } else if (e.key === "Escape") { search.value = ""; closeResults(); }
  });

  // ---- Start: the hash wins, then the last page, then the first page ----
  if (location.hash && location.hash.length > 1) route();
  else {
    var saved = load(":page"), start = byKey[saved] || pages[0];
    if (start) {
      try { history.replaceState(null, "", "#" + start.key); } catch (e) { /* hash not writable */ }
      show(start);
    }
  }
})();
</script>
</body>
</html>
