<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Help</title>
<!--
  Progenitor help page. One self-contained file: it opens from disk with no server and no network.
  Edit only the content block between HELP-CONTENT START and HELP-CONTENT END (templates/help/README.md).
  Everything else (style, renderer, navigation) is shared: tools/help-guide/sync.mjs copies it from
  templates/help/index.html into docs/guide/progenitor-guide.html.
-->
<style>
:root {
  /* Colors from the game's menus and Progenitor's kit (src/Progenitor.Core/Ui/MenuPalette.cs). */
  --bg: #0a0506;
  --panel: #170709;
  --panel-2: #1f090c;
  --panel-hi: #2a0c11;
  --rule: #3a1418;
  --rule-soft: #2a0f13;
  --red: #a8242a;
  --red-hi: #c8323c;
  --title-red: #c8323c;
  --text: #ece8e2;
  --body: #d2cbc4;
  --muted: #958d8a;
  --btn-fill: #111827;
  --btn-fill-hi: #17213a;
  --btn-border: #3d4f73;
  --btn-border-hi: #7088b8;
  --btn-text: #d6deec;
  --gold: #e0b25a;
  --ok: #6fd08a;
  --pend: #e8c25a;
  --warn: #f0955a;
  --danger: #e0565e;
  --code-bg: #0c0708;
  --code-text: #cfc4b8;
  --focus: #9fb6e6;
  --serif: Georgia, "Times New Roman", Times, serif;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: Consolas, "Cascadia Mono", "SFMono-Regular", Menlo, "Liberation Mono", monospace;
  --sidebar: 280px;
  --top: 60px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse 70% 55% at 65% -5%, rgba(120, 20, 28, 0.32), transparent 70%),
    radial-gradient(ellipse 55% 45% at 0% 105%, rgba(90, 14, 20, 0.30), transparent 70%);
  background-attachment: fixed;
  color: var(--body);
  font: 16px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: #b9c9ea; text-decoration-color: rgba(185, 201, 234, 0.4); text-underline-offset: 3px; }
a:hover { color: #dfe7f7; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -9999px; top: 8px; z-index: 60; background: var(--panel); color: var(--text); padding: 8px 12px; }
.skip:focus { left: 8px; }

/* Buttons: the game's gray-blue framed button */
.btn {
  font: 600 14px/1 var(--sans); color: var(--btn-text);
  background: linear-gradient(180deg, var(--btn-fill-hi), var(--btn-fill));
  border: 1px solid var(--btn-border); border-radius: 2px;
  padding: 9px 14px; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.btn:hover { border-color: var(--btn-border-hi); color: #fff; }
.btn[disabled] { opacity: 0.45; cursor: default; border-color: #2a3550; color: var(--muted); }

/* Layout */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); grid-template-rows: auto 1fr auto; min-height: 100vh; }
.app.toc-closed { grid-template-columns: 0 minmax(0, 1fr); }
.top {
  grid-column: 1 / -1; position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px; min-height: var(--top); padding: 8px 20px;
  background: linear-gradient(180deg, rgba(30, 8, 11, 0.97), rgba(14, 5, 7, 0.97));
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; min-width: 0; }
.brand img, .brand .mono { width: 38px; height: 38px; flex: none; }
.brand .mono { display: grid; place-items: center; border: 1px solid var(--rule); background: var(--panel-hi); color: var(--title-red); font: 600 20px/1 var(--serif); border-radius: 50%; }
.brand-title { display: block; font: 600 22px/1.1 var(--serif); color: var(--title-red); letter-spacing: 0.02em; white-space: nowrap; }
.brand-sub { display: block; font: 13px/1.2 var(--serif); color: var(--muted); font-variant: small-caps; letter-spacing: 0.06em; }
.spacer { flex: 1; }
.search { position: relative; width: min(340px, 38vw); }
.field {
  width: 100%; font: 14px/1.2 var(--sans); color: var(--text);
  background: #0e1220; border: 1px solid var(--btn-border); border-radius: 2px; padding: 9px 12px;
}
.field::placeholder { color: #7d8396; }
.field:focus-visible { border-color: var(--btn-border-hi); outline-offset: 0; }
.results {
  position: absolute; right: 0; top: calc(100% + 6px); width: min(440px, 86vw); max-height: 60vh; overflow: auto;
  margin: 0; padding: 4px 0; list-style: none; z-index: 40;
  background: var(--panel); border: 1px solid var(--rule); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.65);
}
.results[hidden] { display: none; }
.results a { display: block; padding: 8px 14px; text-decoration: none; color: var(--body); border-left: 3px solid transparent; }
.results a:hover, .results a[aria-selected="true"] { background: var(--panel-hi); border-left-color: var(--red-hi); }
.r-title { font: 600 15px/1.3 var(--serif); color: var(--text); }
.r-where { font-size: 12px; color: var(--muted); margin-left: 6px; }
.r-snip { display: block; font-size: 13px; color: var(--muted); }
.results mark { background: rgba(200, 50, 60, 0.35); color: var(--text); }
.r-none { padding: 10px 14px; color: var(--muted); font-size: 14px; }
.r-div { margin: 6px 0 2px; padding: 8px 14px 2px; border-top: 1px solid var(--rule-soft); }
.pathnote { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 16px; padding: 8px 12px; border: 1px solid var(--rule-soft); background: rgba(0, 0, 0, 0.28); font-size: 14px; color: var(--muted); }
.pathnote b { color: var(--text); }
.pathnote .btn { padding: 6px 10px; font-size: 13px; }

/* Sidebar */
.toc {
  position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto;
  background: linear-gradient(180deg, rgba(23, 7, 9, 0.96), rgba(11, 5, 6, 0.96));
  border-right: 1px solid var(--rule-soft); padding: 12px 0 28px;
}
.app.toc-closed .toc { visibility: hidden; padding: 0; border: 0; }
.toc { grid-column: 1; grid-row: 2; }
.scrim { display: none; }
.label { font: 600 13px/1.2 var(--sans); font-variant: small-caps; letter-spacing: 0.1em; color: var(--muted); text-transform: lowercase; }
.toc > .label { margin: 8px 20px 8px; }
.rolebar .label { display: block; }
.rolebar > span { min-width: 0; }
.rolebar { margin: 2px 14px 12px; padding: 10px 12px; border: 1px solid var(--rule); background: var(--panel-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rolebar b { display: block; font: 600 16px/1.2 var(--serif); color: var(--text); }
.rolebar .btn { flex: none; white-space: nowrap; padding: 7px 10px; font-size: 13px; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.chap-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-left: 3px solid transparent;
  padding: 8px 16px 8px 18px; font: 600 15px/1.3 var(--serif); color: var(--text);
}
.chap-btn:hover { background: var(--panel-hi); }
.chev { width: 10px; flex: none; color: var(--muted); transition: transform 0.15s; }
.chap-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
.chap.current > .chap-btn { border-left-color: var(--red); }
.pages { display: none; padding: 0 0 6px; }
.chap-btn[aria-expanded="true"] + .pages { display: block; }
.pages a { display: block; padding: 5px 16px 5px 42px; font-size: 14px; line-height: 1.35; color: var(--muted); text-decoration: none; border-left: 3px solid transparent; }
.pages a:hover { color: var(--text); background: var(--panel-hi); }
.pages a[aria-current="page"] { color: var(--text); border-left-color: var(--red-hi); background: linear-gradient(90deg, rgba(168, 36, 42, 0.45), rgba(168, 36, 42, 0.08)); }

/* Page card */
main { grid-column: 2; grid-row: 2; padding: 30px 36px 18px; min-width: 0; }
.crumb { max-width: 800px; margin: 0 auto 10px; display: flex; justify-content: space-between; gap: 12px; }
.card {
  position: relative; max-width: 800px; margin: 0 auto; min-height: 380px; padding: 30px 40px 28px;
  background: linear-gradient(180deg, rgba(31, 9, 12, 0.97), rgba(19, 7, 9, 0.98));
  border: 1px solid var(--rule); border-radius: 2px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.7), 0 18px 40px rgba(0, 0, 0, 0.55);
  overflow-wrap: break-word;
}
/* Text styles. Titles and button captions centered, body text left, numbers right (as in the game). */
.card h1 { margin: 0 0 4px; text-align: center; font: 600 30px/1.2 var(--serif); color: var(--text); }
.card .lede { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
.rule { height: 1px; border: 0; margin: 14px 0 20px; background: linear-gradient(90deg, transparent, var(--red) 30%, var(--red) 70%, transparent); }
.btn, .role, .pager .ttl { text-align: center; }
.card .num, .card th.num { text-align: right; font-variant-numeric: tabular-nums; }
.card p { margin: 0 0 14px; }
.card ul, .card ol { margin: 0 0 14px; padding-left: 1.3em; }
.card li { margin: 0 0 7px; }
.card li::marker { color: var(--muted); }
.card strong { color: var(--text); }
.card code { font: 0.9em var(--mono); color: var(--code-text); background: rgba(0, 0, 0, 0.35); border: 1px solid var(--rule-soft); border-radius: 2px; padding: 1px 5px; }
.card table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 15px; }
/* Wide tables scroll inside their own box instead of widening the page. */
.tbl { overflow-x: auto; margin: 0 0 16px; }
.tbl > table { margin: 0; }
.card th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--rule); }
.card td { padding: 8px 10px; border-bottom: 1px solid var(--rule-soft); vertical-align: top; }
.card td:first-child { color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
.grid > div { padding: 11px 13px; background: rgba(0, 0, 0, 0.28); border: 1px solid var(--rule-soft); border-top: 2px solid var(--red); font-size: 14px; color: var(--muted); }
.grid b { display: block; margin-bottom: 3px; font: 600 16px/1.3 var(--serif); color: var(--text); }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid .ok { border-top-color: var(--ok); }
.grid .pend { border-top-color: var(--pend); }
.grid .bad { border-top-color: var(--danger); }
.outline { list-style: none; padding-left: 0 !important; counter-reset: o; }
.outline li { counter-increment: o; position: relative; margin: 0 !important; padding: 8px 10px 8px 40px; border-bottom: 1px solid var(--rule-soft); }
.outline li::before { content: counter(o); position: absolute; left: 12px; top: 8px; font: 600 15px/1.5 var(--serif); color: var(--muted); }
.soon { display: inline-block; vertical-align: middle; margin-left: 10px; padding: 4px 8px; font: 600 12px/1 var(--sans); font-variant: small-caps; letter-spacing: 0.08em; color: var(--gold); border: 1px solid rgba(224, 178, 90, 0.45); border-radius: 2px; }

/* Callout */
.callout { margin: 4px 0 14px; padding: 11px 15px; border: 1px solid var(--rule); border-left: 3px solid var(--red); background: rgba(58, 14, 20, 0.45); font-size: 15px; }
.callout.warn { border-left-color: var(--danger); background: rgba(80, 14, 20, 0.55); }
.callout .label { display: block; margin-bottom: 3px; color: #e07a7f; }
.callout p { margin: 0; }

/* Screenshot */
.shot { margin: 6px 0 16px; }
.shot a { display: block; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; background: #000; }
.shot a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { margin-top: 6px; font-size: 13.5px; color: var(--muted); }

/* Code */
.code { position: relative; margin: 2px 0 16px; background: var(--code-bg); border: 1px solid var(--rule-soft); border-radius: 2px; }
.code .lang { position: absolute; left: 12px; top: 7px; font: 600 11px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: #6f6467; }
.code pre { margin: 0; padding: 30px 16px 14px; overflow: auto; font: 13.5px/1.55 var(--mono); color: var(--code-text); tab-size: 4; }
.card .code code { background: none; border: 0; padding: 0; font: inherit; color: inherit; }
.copy { position: absolute; right: 8px; top: 6px; padding: 6px 10px; font-size: 12px; }
.tk-c { color: #7f8b74; font-style: italic; }
.tk-s { color: #d9b48a; }
.tk-k { color: #e07a72; }
.tk-t { color: #9ab8d6; }
.tk-n { color: #c3a3d9; }
.tk-a { color: #d9a85e; }

/* Role choice */
.roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 4px 0 16px; }
.role {
  cursor: pointer; padding: 16px 16px 14px; color: var(--body);
  background: linear-gradient(180deg, rgba(42, 12, 17, 0.9), rgba(22, 7, 9, 0.9));
  border: 1px solid var(--rule); border-top: 2px solid var(--rule); border-radius: 2px; font: 14px/1.5 var(--sans);
}
.role:hover { border-color: var(--btn-border-hi); }
.role b { display: block; margin-bottom: 6px; font: 600 19px/1.2 var(--serif); color: var(--text); }
.role[aria-pressed="true"] { border-top-color: var(--red-hi); background: linear-gradient(180deg, rgba(120, 24, 30, 0.55), rgba(30, 8, 11, 0.9)); }
.role .go { display: block; margin-top: 10px; color: #b9c9ea; font-weight: 600; font-size: 13px; }

/* Terms, tooltip and glossary */
a.term { color: var(--text); text-decoration: underline dotted rgba(236, 232, 226, 0.55); text-decoration-thickness: 1.5px; text-underline-offset: 4px; cursor: help; }
a.term:hover, a.term:focus-visible { color: #fff; text-decoration-color: var(--red-hi); }
.tip {
  position: fixed; z-index: 50; max-width: 330px; padding: 10px 13px; pointer-events: none;
  background: var(--panel); border: 1px solid var(--rule); border-top: 2px solid var(--red);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.7); font-size: 14px; line-height: 1.5; color: var(--body);
}
.tip[hidden] { display: none; }
.tip b { display: block; margin-bottom: 2px; font: 600 15px/1.3 var(--serif); color: var(--text); }
.tip small { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); }
.gl-tools { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; }
.gl-count { white-space: nowrap; font-size: 13px; color: var(--muted); }
.gl-list { margin: 0; max-height: 54vh; overflow: auto; padding-right: 6px; border-top: 1px solid var(--rule-soft); }
.gl-entry { padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--rule-soft); border-left: 3px solid transparent; }
.gl-entry dt { font: 600 17px/1.3 var(--serif); color: var(--text); }
.gl-entry dd { margin: 3px 0 0; font-size: 15px; }
.gl-entry.flash { border-left-color: var(--red-hi); background: var(--panel-hi); }
.gl-entry[hidden] { display: none; }

/* Pager and footer */
.pager { max-width: 800px; margin: 16px auto 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.pager .btn { min-width: 170px; padding: 10px 16px; }
.pager .dir { display: block; margin-bottom: 5px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8e9ab4; }
.pager .ttl { display: block; max-width: 230px; margin: 0 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 600 15px/1.25 var(--serif); }
.mid { text-align: center; font-size: 13px; color: var(--muted); }
.mid .big { display: block; font: 600 18px/1.2 var(--serif); color: var(--text); font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 300px; margin-top: 6px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; background: #3a2226; }
.dots span.on { background: var(--gold); }
.foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; padding: 12px 22px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule-soft); background: rgba(10, 5, 6, 0.92); }
.kbd { font: 12px var(--mono); color: var(--text); background: #141a28; border: 1px solid var(--btn-border); border-bottom-width: 2px; border-radius: 2px; padding: 0 5px; }

@media (max-width: 1100px) {
  :root { --sidebar: 240px; }
  main { padding: 24px 20px 16px; }
  .card { padding: 26px 26px 24px; }
}
/* Narrow screens: one column, and Contents becomes a drawer over the page. */
@media (max-width: 760px) {
  .app, .app.toc-closed { grid-template-columns: minmax(0, 1fr); }
  main { grid-column: 1; padding: 16px 16px 14px; }
  .top { gap: 10px; padding: 8px 16px; }
  #tocBtn { white-space: nowrap; }
  .toc {
    position: fixed; left: 0; top: var(--top); bottom: 0; height: auto; width: min(300px, 86vw); z-index: 35;
    box-shadow: 14px 0 30px rgba(0, 0, 0, 0.6); transition: transform 0.18s ease-out, visibility 0.18s;
  }
  .app.toc-closed .toc { transform: translateX(-100%); padding: 12px 0 28px; border-right: 1px solid var(--rule-soft); }
  .scrim { position: fixed; inset: var(--top) 0 0 0; z-index: 34; background: rgba(0, 0, 0, 0.55); }
  .app:not(.toc-closed) .scrim { display: block; }
  .brand-sub { display: none; }
  .card { padding: 22px 16px 20px; min-height: 0; }
  .card h1 { font-size: 26px; }
  .grid, .grid.two, .roles { grid-template-columns: 1fr; }
  .pager { gap: 8px; }
  .pager .btn { flex: 1 1 0; min-width: 0; padding: 9px 10px; }
  .pager .ttl { max-width: none; }
  .mid { flex: none; }
  .dots { display: none; }
  .foot { padding: 12px 16px; }
}
@media (max-width: 520px) {
  .brand > span:not(.mono) { display: none; }
  .spacer { display: none; }
  .search { flex: 1; width: auto; min-width: 0; }
  .mid #counterSub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<div class="app" id="app">
  <header class="top">
    <button class="btn" id="tocBtn" type="button" aria-controls="toc" aria-expanded="true">&#9776; Contents</button>
    <a class="brand" id="brand" href="#"></a>
    <span class="spacer"></span>
    <div class="search" role="search">
      <label class="sr" for="search">Search this help</label>
      <input class="field" id="search" type="search" placeholder="Search  ( / )" autocomplete="off" aria-controls="results" aria-expanded="false">
      <ul class="results" id="results" role="listbox" aria-label="Search results" hidden></ul>
    </div>
  </header>
  <nav class="toc" id="toc" aria-label="Contents"></nav>
  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <main id="main" tabindex="-1">
    <div class="crumb"><span class="label" id="crumbLeft"></span></div>
    <article class="card" id="card" aria-live="polite"></article>
    <nav class="pager" aria-label="Page">
      <button class="btn" id="prevBtn" type="button"><span class="dir">&larr; Previous</span><span class="ttl" id="prevTitle"></span></button>
      <div class="mid"><span class="big" id="counter"></span><span id="counterSub"></span><div class="dots" id="dots" aria-hidden="true"></div></div>
      <button class="btn" id="nextBtn" type="button"><span class="dir">Next &rarr;</span><span class="ttl" id="nextTitle"></span></button>
    </nav>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<!-- HELP-CONTENT START -->
<script>
/*
  The Progenitor Help Guide's content. Edit only this block; the renderer around it is copied from
  templates/help/index.html by tools/help-guide/sync.mjs. Page fields: id, title, lede, html,
  code {lang, text}, callout {title, text, warn}, shot {src: "img/<name>.webp", alt, caption}, soon.
  [[term-id|words]] links a glossary term. Limits per page: a heading plus about 60 words or 3-5
  bullets, one code block, one callout, one screenshot (images in docs/guide/img, always with alt text).
  Glossary definitions are one sentence. API names are checked against src/.
*/
window.HELP = {
  id: "progenitor-guide",
  title: "Progenitor",
  subtitle: "Help Guide",

    { id: "players", title: "Players", blurb: "Install mods, join modded servers and change settings." },

  chapters: [
    {
      id: "start", title: "Welcome", pages: [
        { id: "welcome", title: "What Progenitor is", shot: { src: "img/welcome-castle.webp", alt: "A player's castle in V Rising seen from above, its walls and halls under fog" },
          html: `<p>[[progenitor|Progenitor]] is a mod manager and modding framework for V Rising, loaded through [[bepinex|BepInEx]]. Its in-game <strong>Mods</strong> menu installs, updates and turns off mods, and holds every mod's settings and keybinds. It also adds features of its own: a better chat box, build menu search, dye all and photo mode.</p>
<p>Mods built on it can load, update and unload while the game runs, and clean up after themselves.</p>
<p>For the fastest help, <a href="#help/ai-help">ask an AI assistant (ChatGPT, Gemini, Grok, Claude&hellip;) with our ready-made prompt &rarr;</a></p>` },
        { id: "choose", title: "Choose your path", chooser: true,
          html: `<p>Pick what you want to do. You can switch at any time from the contents.</p>` }
      ]
    },

    /* ---------------- Players ---------------- */
    {
      id: "players", role: "players", title: "Getting Started", pages: [
        { id: "install-bepinex", title: "Install BepInEx",
          html: `<ol><li>Find the [[game-folder|game folder]]: Steam &rsaquo; right-click <strong>V Rising</strong> &rsaquo; <strong>Manage</strong> &rsaquo; <strong>Browse local files</strong>.</li>
<li>Download <a href="https://thunderstore.io/c/v-rising/p/BepInEx/BepInExPack_V_Rising/">BepInExPack_V_Rising</a> (<strong>Download</strong>, not Install with App) and extract it outside the game folder.</li>
<li>Copy everything inside its <code>BepInExPack_V_Rising</code> folder (<code>BepInEx</code>, <code>dotnet</code>, <code>winhttp.dll</code>, <code>doorstop_config.ini</code> and the rest) into the game folder, next to <code>VRising.exe</code>.</li>
<li>Start the game once. A [[bepinex|BepInEx]] console opens; the first start is slow while it generates its files.</li></ol>
<p>Already have BepInEx, or using the installer on the next page? Skip to the next page.</p>` },
        { id: "install", title: "Install Progenitor",
          html: `<p>Two ways. Both give you the latest release.</p>
<p><strong>1. Download the zip</strong></p>
<ol><li>Install BepInEx (previous page), then quit the game.</li>
<li>Open the <a href="https://github.com/VRising-Modders/Progenitor/releases/latest">latest release</a> and, under <strong>Assets</strong>, download <code>Progenitor-&lt;version&gt;.zip</code> (not the <code>-thunderstore</code> zip or the source code).</li>
<li>Right-click the zip &rsaquo; <strong>Extract All</strong>, and pick the [[game-folder|game folder]], the one that holds <code>VRising.exe</code>. Its <code>BepInEx</code> folder joins the one already there; when Windows asks, replace the files.</li>
<li>Start the game. <strong>Mods</strong> appears on the title screen.</li></ol>
<p><strong>2. The installer</strong></p>
<ol><li>Quit the game.</li>
<li>Open <strong>PowerShell</strong> from the Start menu, paste this line and press Enter:</li></ol>{{code}}
<p>It finds V Rising through Steam, installs BepInEx if it's missing or broken, installs Progenitor and tells you what it did. Files it replaces go to <code>BepInEx\\progenitor-backups</code> first. Then start the game.</p>
<p>The script is public; read it first at <a href="https://vrising-modders.github.io/Progenitor/install.ps1">vrising-modders.github.io/Progenitor/install.ps1</a>. Saved it instead? Run <code>powershell -ExecutionPolicy Bypass -File install.ps1</code> in the folder you saved it to. Game in a folder Steam doesn't know? Add <code>-GamePath "D:\\Games\\VRising"</code> to that line.</p>
<p>A working BepInEx stays as it is. When the installer repairs a broken one, the files it replaces go to the same backup; your BepInEx settings are always kept.</p>
<p>Either way, Progenitor updates itself from GitHub from then on, at the title screen. See <a href="#menu/updates">Updates</a>. To update by hand, do either one again. The script won't put an older Progenitor over a newer one unless you add <code>-Force</code>.</p>`,
          code: { lang: "powershell", text: `irm https://vrising-modders.github.io/Progenitor/install.ps1 | iex` } },
        { id: "open", title: "Open the Mods menu", shot: { src: "img/players-open-title.webp", alt: "The V Rising title screen with Mods above Continue", caption: "<strong>Mods</strong> on the title screen." },
          html: `<ul><li><strong>Mods</strong> on the title screen.</li><li>The <strong>MODS</strong> tab in the in-game menu.</li><li><span class="kbd">F10</span> anywhere (remappable).</li></ul>
<p>Tabs: <strong>Mods</strong>, <strong>Install Mods</strong>, <strong>Keybinds</strong>, <strong>Preferences</strong>, <strong>Server</strong>.</p>` },
        { id: "mod-page", title: "Every mod's settings are here",
          html: `<p>Every mod built on Progenitor keeps its settings in the Mods menu.</p>
<ul><li><strong>Mods</strong> tab &rsaquo; pick the mod: on/off switch, About, its settings and keys, and <strong>Help</strong> when it has a guide.</li>
<li><strong>Keybinds</strong> tab: every mod's keys and the game's own, remappable; conflicts are marked.</li>
<li>[[server-setting|Server settings]] follow the server while you are on it; only [[admin|admins]] change them. Yours come back when you leave.</li>
<li>Your own settings save as you change them, even while you are on a server.</li></ul>` },
        { id: "features", title: "What Progenitor adds",
          html: `<ul><li><a href="#chat/overview">A better chat box</a>: tabs, history, links, mentions.</li>
<li><a href="#game/build-search">Build menu search</a> and <a href="#game/dye-all">Dye all</a> (hold a color swatch).</li>
<li><a href="#game/photo-mode">Photo mode</a> (off until you turn it on), <a href="#game/history">Back and forward</a> through menus.</li>
<li><a href="#keybinds/tab">Remappable keys</a> for every mod and the game.</li></ul>
<p>The next chapters cover each one and its settings.</p>` },
        { id: "install-mods", title: "Install mods",
          html: `<p>Open [[install-tab|Install Mods]], find a mod and click <strong>Install</strong>. Some load at once; others ask for a restart.</p>
<ul><li><strong>Simple</strong> (default): one button per mod. <strong>Advanced</strong>: separate Client and Server columns, a server picker and more filters. Switch at the left of the search box.</li>
<li>Click a row to see its <strong>Side</strong>: Client (this game), Server, or Client and server.</li>
<li>Players need only client mods. Server-only mods are listed only for an [[admin|admin]] of the server you are on.</li>
<li>A client and server mod also needs the server to run it; ask its admin. As an admin, Simple can install it on both at once.</li></ul>` },
        { id: "join", title: "Join a modded server",
          html: `<p>When you join, the server checks your mods against its own (the [[handshake|handshake]]). After its welcome message, <strong>Mods for &lt;server&gt;</strong> shows:</p>
<ul><li><strong>Required to join</strong>: [[required-mod|mods you must have]], with <em>N of M ready</em>.</li>
<li><strong>Recommended</strong>: [[recommended-mod|optional mods]] with the admin's reason.</li>
<li><strong>Install N mods</strong> gets them from Thunderstore, then join or restart and rejoin.</li></ul>` },
        { id: "updates", title: "Updates",
          html: `<p><strong>Preferences &rsaquo; Updates</strong>:</p>
<ul><li><strong>Update mods</strong>: Automatic (default), Notify or Off.</li><li><strong>Offer updates before joining a server</strong>: on by default.</li><li>Per mod, on its page: a different mode, or keep one version.</li>
<li><strong>Update Progenitor</strong>: Automatic (default). Progenitor updates itself from GitHub.</li></ul>` },
        { id: "help", title: "When something goes wrong",
          html: `<ol><li>Crashed? Start the game again; the last three sessions' logs are kept.</li>
<li>Collect logs: <strong>Mods &rsaquo; Progenitor &rsaquo; Get help &rsaquo; Collect logs</strong>. If the game crashes when you join, use the zip icon at the bottom left of the title screen. A zip lands on your Desktop.</li>
<li>For the fastest help, <a href="#help/ai-help">ask an AI assistant (ChatGPT, Gemini, Grok, Claude&hellip;) with our ready-made prompt &rarr;</a> Or post the zip in the <a href="https://discord.com/channels/978094827830915092/1112888087836631090">Progenitor channel</a> on the V Rising Mod Community Discord (<a href="https://vrisingmods.com/discord">join it</a> first) or a <a href="https://github.com/VRising-Modders/Progenitor/issues/new?template=bug-report.yml">GitHub bug report</a>.</li></ol>`,
          callout: { title: "Before sharing", text: "IDs, IP addresses and known player names are removed, but look through the zip before you share it with anyone, an AI included." } }
      ]
    },

    /* ---------------- Players: Chat ---------------- */
    {
      id: "chat", role: "players", title: "Chat", pages: [
        { id: "overview", title: "The chat box", shot: { src: "img/chat-overview.webp", alt: "The chat box with its All and Clan tabs" },
          html: `<p>Progenitor builds on the game's chat box. To go back to the game's own chat lines, turn off <strong>Progenitor's chat lines</strong>.</p>
<ul><li>Chat stays on screen for 30 seconds after the last message, instead of 14.</li><li>Clicking the chat doesn't attack or turn the camera, and the mouse wheel scrolls only the chat.</li>
<li>The next pages cover tabs, moving and resizing, history, links, mentions and more.</li></ul>
<p>Settings: <strong>Mods &rsaquo; Progenitor &rsaquo; Chat</strong>, or <strong>&equiv;</strong> &rsaquo; <strong>All chat settings</strong> on the chat box.</p>`,
          callout: { title: "Another chat mod?", text: "If another mod replaces the chat window, Progenitor's chat lines turn off on their own. The fade, click protection and commands keep working." } },
        { id: "window", title: "Fade and clicks",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Seconds chat stays on screen</td><td class="num">30</td><td>14 to 600 seconds after the last message.</td></tr>
<tr><td>Keep chat on screen</td><td>Off</td><td>Never fades; Escape still closes it.</td></tr>
<tr><td>Keep chat up while the mouse is over it</td><td>On</td><td>Chat doesn't fade while your mouse is over it.</td></tr>
<tr><td>Clicking chat doesn't attack</td><td>On</td><td>Clicks on the chat never attack, turn the camera or build.</td></tr></tbody></table>
<p>If you moved attack to a keyboard key, that key also does nothing while your mouse is over the chat.</p>` },
        { id: "move", title: "Move and resize",
          html: `<ul><li><strong>Move:</strong> drag an empty spot in the tab row.</li>
<li><strong>Resize:</strong> drag the <strong>&#9701;</strong> corner at the top right.</li>
<li><strong>Reset:</strong> <strong>&equiv;</strong> &rsaquo; <strong>Reset position and size</strong>.</li>
<li><strong>Lock / Unlock position</strong> in the same menu keeps it where it is.</li></ul>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Lock the chat box's position</td><td>Off</td><td>Stops moving and resizing.</td></tr>
<tr><td>Text size</td><td class="num">0</td><td>Up to 40; 0 uses the game's size.</td></tr>
<tr><td>Background opacity</td><td class="num">-1</td><td>0 to 100 percent; -1 uses the game's. Quick picks are in <strong>&equiv;</strong>.</td></tr></tbody></table>` },
        { id: "tabs", title: "Tabs",
          html: `<p>The tab row has <strong>All</strong>, your own tabs (<strong>Clan</strong> to start), <strong>+</strong> (add a tab) and <strong>&equiv;</strong> (tab menu). You can have up to six.</p>
<ul><li><strong>Show:</strong> click a tab.</li>
<li><strong>Typing:</strong> each tab has its own channel. A tab types to the smallest group it shows: Clan, then Local, then Global. If you switch to another channel the tab shows (<strong>/g</strong>, <strong>/l</strong>, <strong>/c</strong> or Tab), the tab keeps it. A channel the tab doesn't show only lasts until you close the chat. All, Mentions and System tabs don't change your channel and don't remember one. On a Whispers tab, opening chat starts a whisper to the last person you whispered with; clear the line to talk in Local. Text you haven't sent stays with its tab until you come back to it.</li>
<li><strong>Reorder:</strong> drag a tab to a new spot, or right-click it &rsaquo; <strong>Move left</strong> / <strong>Move right</strong>. The order is saved.</li>
<li><strong>Add:</strong> <strong>+</strong> or <strong>New tab</strong>: Whispers, System and mods, Mentions, Clan, Local, or <strong>Custom</strong>.</li>
<li><strong>Rename and filter:</strong> right-click the tab &rsaquo; <strong>Edit this tab</strong>. Give it a name (up to 16 characters) and check the channels it shows under <strong>Show messages from</strong>, then click <strong>Save</strong>. A tab needs a name and at least one channel. <strong>Custom</strong> in <strong>New tab</strong> opens the same dialog.</li>
<li><strong>Remove:</strong> right-click &rsaquo; <strong>Close this tab</strong>. All can't be edited or closed.</li>
<li>A star on a tab means it has new messages.</li>
<li>If you send to a channel this tab doesn't show, a short note tells you where to find it, and that tab blinks. Click the note to go there.</li></ul>` },
        { id: "colors", title: "Channel colors",
          html: `<p><strong>&equiv;</strong> &rsaquo; <strong>Colors</strong> lets you pick a color for each channel.</p>
<ul><li>Click a swatch to recolor that channel. It's saved right away.</li><li><strong>Use the game's colors</strong> puts them all back.</li></ul>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Color the line you type by channel</td><td>On</td><td>What you type takes the channel's color, so you can see where it goes.</td></tr></tbody></table>` },
        { id: "history", title: "History, repeats and time",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Progenitor's chat lines</td><td>On</td><td>Tabs, history, links, mentions and repeat counts. Off: the game's own lines.</td></tr>
<tr><td>Keep chat between sessions</td><td>On</td><td>Each server's chat comes back when you rejoin, dimmed, with <em>Joined</em> and <em>Left</em> lines.</td></tr>
<tr><td>Lines kept per server</td><td class="num">5000</td><td>50 to 5000. Scroll up in the chat box to read back through them; older lines load as you reach the top, and scrolling back to the bottom jumps to the newest. A lower number drops the oldest lines at once.</td></tr>
<tr><td>Fold repeated lines into a count</td><td>On</td><td>The same line within a minute shows &times;2, &times;3.</td></tr>
<tr><td>Show the time on each line</td><td>Off</td><td><code>[16:05]</code>; skipped when the game's own timestamps are on.</td></tr></tbody></table>
<p>While you are scrolled up, new lines don't move what you are reading. Scroll to the bottom to jump to the newest lines.</p>` },
        { id: "links", title: "Web links",
          html: `<ul><li>Web addresses in chat are clickable.</li>
<li>Clicking one always asks first: <strong>Open in browser</strong>, <strong>Copy link</strong> or <strong>Cancel</strong>.</li>
<li>A server can turn clickable links off (<strong>Allow clickable links</strong>).</li></ul>`,
          callout: { title: "Open only links you trust", warn: true, text: "Anyone in chat can post a link." } },
        { id: "mod-links", title: "Mod links",
          html: `<p>A mod link points at a Thunderstore mod: <code>[mod:Namespace-Name]</code>, or <code>[mod:Namespace-Name@1.2.3]</code> for one version.</p>
<ul><li><strong>Click one:</strong> opens the mod's page if you have it, else its Install Mods listing. It never installs anything.</li>
<li><strong>Share one:</strong> hover a row in Mods or Install Mods and click <strong>Share</strong>, or <strong>Copy link</strong> on a mod page. Paste it in chat with <span class="kbd">Ctrl+V</span>.</li>
<li><strong>Type one:</strong> type <code>[mod:</code> and part of a name, then press <span class="kbd">Tab</span> to fill in a match (again for the next).</li></ul>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Suggest mods after "[mod:"</td><td>On</td><td>Suggests mod names as you type.</td></tr></tbody></table>
<p>A server can turn mod links off (<strong>Allow mod links</strong>).</p>
<p><strong>Links from mods.</strong> A server mod can put links in its messages, such as a storage chest in a reply. They're clickable when you have that mod, and plain words otherwise. Players can't fake one by typing it.</p>` },
        { id: "item-links", title: "Location and item links",
          html: `<ul><li><strong>Location:</strong> start a line with <code>/loc </code> to share where you are, or send <code>/loc</code> on its own. Clicking a location asks <em>Set a map marker here?</em> with how far away it is and which way. <strong>Set marker</strong> puts your own map marker there, the same one you place by clicking the map, with its route on the map and its guide on the compass. It replaces your old marker. The world map then opens centered on the marker, at the zoom you last used. If the game menu is open on another tab, it switches to the Map tab; if the map is already open, it moves to the marker. A marker on another zone's map (for example while you're in a dungeon) opens the map without centering it. The map doesn't open while another game menu is open or while you're typing in chat; the marker is still set.</li>
<li><strong>From the map:</strong> <span class="kbd">Shift</span> + click a spot on the world map. The map closes and that spot's location goes into your chat line, ready for you to add a few words and press <span class="kbd">Enter</span>. The map's key hints at the bottom show it as <em>Share Location</em>. On a controller, hold <span class="kbd">D-Pad Down</span> and press <span class="kbd">Y</span> (<span class="kbd">Triangle</span>) to share the spot under the map cursor. Remap it in the Keybinds tab (Share map location).</li>
<li><strong>Item:</strong> start a line with <code>/item &lt;prefab name&gt; </code> to link an item. Hover the link for its name and description, or click it to open them in a window. There's no item search yet, so you need the item's prefab name.</li>
<li><strong>Hunt zone:</strong> when a mod names a servant hunt in chat, you see the zone's name, like "Fishing Lake". Players without Progenitor see a code such as <code>[mission:-1234]</code> instead.</li>
<li>Some mods add more to a click, such as showing the place on the map.</li></ul>` },
        { id: "mentions", title: "Mentions",
          html: `<p>A line with your name, one of your watched words, or <code>@all</code> from an admin is highlighted and plays a short sound. If your character is Vlad, both <code>Vlad, need help?</code> and <code>@Vlad meet at the gate</code> count. System and mod lines never count.</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Highlight mentions</td><td>On</td><td>Highlights the line.</td></tr>
<tr><td>Play a sound for mentions</td><td>On</td><td>Plays the sound.</td></tr>
<tr><td>Watched words</td><td>Empty</td><td>Extra words, comma separated (up to 20).</td></tr></tbody></table>
<p>A server can turn <code>@all</code> off (<strong>Allow @all from admins</strong>).</p>` },
        { id: "line-actions", title: "Copy, whisper and mute",
          html: `<p>Right-click a player's line:</p>
<ul><li><strong>Copy line</strong>: to the clipboard.</li><li><strong>Whisper &lt;name&gt;</strong>: puts <code>/w name </code> in the input.</li>
<li><strong>Mute &lt;name&gt;</strong> / <strong>Unmute &lt;name&gt;</strong>: hides their lines from your chat.</li></ul>
<p>Right-click your own or a system line to copy it.</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Muted players</td><td>Empty</td><td>Names, comma separated. Delete a name here to unmute.</td></tr></tbody></table>` },
        { id: "typing", title: "Typing shortcuts",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>/r replies to the last whisper</td><td>On</td><td><code>/r </code> becomes <code>/w &lt;name&gt; </code> for your latest whisper, sent or received.</td></tr>
<tr><td>Tab completes names after /w</td><td>On</td><td><code>/w</code> plus part of a name, then <span class="kbd">Tab</span>; again for the next match. Any player online on the server can be completed, near or far.</td></tr>
<tr><td>Up and Down bring back sent lines</td><td>On</td><td>While typing, <span class="kbd">Up</span> brings back the lines you sent, newest first (your last 50, commands too, kept between sessions); <span class="kbd">Down</span> goes forward again, back to what you were typing.</td></tr>
<tr><td>Show command hints after "."</td><td>On</td><td>The server's commands you can run show above the line; <span class="kbd">Tab</span> completes the first. Needs Progenitor on the server.</td></tr>
<tr><td>Send long lines in parts</td><td>On</td><td>A line too long for the game goes out in parts; players with Progenitor see one line.</td></tr></tbody></table>
<p>You can remap these chat keys in the Keybinds tab: <span class="kbd">Tab</span> to complete, <span class="kbd">Up</span>/<span class="kbd">Down</span> to recall, <span class="kbd">Enter</span> to send a long line.</p>` },
        { id: "reload-messages", title: "Mod reload messages",
          html: `<p>When Progenitor or a mod [[hot-reload|hot-reloads]] while you play, a System line in chat says what changed:</p>
<ul><li><em>Progenitor updated to 2026.10.85.</em></li><li><em>MyMod reloaded (2.0.0).</em></li><li><em>OtherMod removed.</em></li>
<li><em>MyMod failed to update; the previous version keeps running.</em></li></ul>
<p>Several changes at once share one line. Lines about the server's mods start with <em>Server hot load:</em>. Nothing is said when the game starts or while you join a server, and lines about your own mods show only while you're in a world.</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Show mod reload messages</td><td>On</td><td>Shows these lines, for your mods and the server's. Off hides both.</td></tr></tbody></table>` }
      ]
    },
    /* ---------------- Players: Mods menu ---------------- */
    {
      id: "menu", role: "players", title: "Mods Menu", pages: [
        { id: "open-close", title: "Open and close",
          html: `<table><thead><tr><th class="label">Where</th><th class="label">How</th></tr></thead><tbody>
<tr><td>Title screen</td><td><strong>MODS</strong>, above Continue.</td></tr>
<tr><td>In a world</td><td>The <strong>Mods</strong> tab in the game's menu, beside Spellbook.</td></tr>
<tr><td>Anywhere</td><td><span class="kbd">F10</span> (Open Mods menu, remappable).</td></tr></tbody></table>
<p>To close the [[workspace|Mods menu]], click <strong>Close Mods</strong> at the bottom of the left list, or press <span class="kbd">F10</span> or <span class="kbd">Escape</span>. In a search box, Escape clears the text first.</p>
<p>Tabs: Mods, Install Mods, Keybinds, Preferences, Server.</p>` },
        { id: "landing", title: "The Mods tab", shot: { src: "img/menu-landing.webp", alt: "The Mods tab with no mod picked: tiles for Your settings, Server settings, Preferences, Collect logs and the Help guide" },
          html: `<p>With no mod picked, tiles lead to <strong>Your settings</strong>, <strong>Server settings</strong>, <strong>Preferences</strong>, <strong>Collect logs</strong> and the <strong>Help guide</strong> (this page).</p>
<ul><li>The list: <strong>Installed</strong>, <strong>On this server</strong>, <strong>Required by Progenitor</strong>. Filter chips: All, Needs attention, Disabled.</li>
<li><strong>Search mods and settings</strong> at the top of the list finds mods by name and settings by name, group or help. Matching settings show grouped by mod and can be changed right there; <strong>Open mod</strong> opens the page, <strong>Show in mod</strong> jumps to the setting. Clear the search to go back where you were.</li>
<li>The diamond beside a mod shows how it's doing: green is running, amber needs a look, red failed, gray is off, hollow is waiting. <strong>Update</strong> means a newer version is out.</li></ul>` },
        { id: "mod-page", title: "A mod's page",
          html: `<ol><li><strong>The bar:</strong> the on/off switch, its status, version, conflicts, <strong>Help</strong> (when the mod has a guide) and <strong>Uninstall</strong>. When the mod is removed at the next start, <strong>Yes, uninstall and restart</strong> marks it for removal and then asks whether to restart the game now. While changes wait for a restart, the page also offers the restart.</li>
<li><strong>Problems</strong>, with <strong>Retry</strong> and <strong>Copy report</strong>.</li>
<li><strong>Details:</strong> where it installs, its store page and <strong>Share in chat</strong> ([[mod-link|mod link]]), updates, kept versions and <strong>Roll back</strong>.</li>
<li><strong>Settings:</strong> <strong>Your preferences</strong> (saved on this PC), <strong>Your settings on this server</strong> (saved by the server, just for you), then [[server-setting|Server settings]] (everyone on the server; admins change them). A mod that runs only on the server can still show its settings here, with the same names, switches, sliders and sections the mod gives them; a row can hide or gray out until another setting allows it. Some mods keep a list of items, such as a pickup filter: the row says how many are listed, and <strong>Edit</strong> opens the list, where you change the count beside each item, take one off with the cross, and add more with <strong>+ Add…</strong> (search by name, or show only items or only categories). Each change is saved by the server at once. Each row has a reset arrow; <strong>Restart</strong> marks one that applies at the next start; <strong>Reset personal settings</strong> asks first and leaves server settings alone.</li>
<li><strong>About</strong>: the mod's description.</li></ol>
<p>Long pages get a search box.</p>` },
        { id: "switch", title: "Turn a mod off",
          html: `<ul><li>A mod built on Progenitor turns off and on at once.</li><li>Others wait for the next start: <em>Turns off at next start</em>.</li>
<li>If other mods need it, it asks first.</li><li>BepInEx and Progenitor's own parts can't be turned off.</li></ul>
<p>A bar on the Mods and Install Mods tabs counts what waits for a restart: <strong>Restart now</strong>, or <strong>Restart and rejoin</strong> the server.</p>` },
        { id: "preferences", title: "Preferences", shot: { src: "img/menu-preferences.webp", alt: "The Preferences tab of the Mods menu" },
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Edit other mods' settings</td><td>Off</td><td>Lets the Mods menu change mods not built on Progenitor.</td></tr>
<tr><td>Install view</td><td>Simple</td><td>Simple or Advanced Install Mods tab.</td></tr>
<tr><td>Remember Install filters and sort</td><td>Off</td><td>Keeps them between sessions.</td></tr>
<tr><td>Use Thunderstore</td><td>On</td><td>Lists Thunderstore's mods in Install Mods.</td></tr>
<tr><td>Show mods with NSFW content</td><td>Off</td><td>Lists them too.</td></tr>
<tr><td>Download limit</td><td class="num">128</td><td>MB, 8 to 1,024. Bigger mods aren't installed.</td></tr>
<tr><td>Show only Progenitor servers</td><td>Off</td><td>Filters the game's Join Game list.</td></tr></tbody></table>
<p><strong>Advanced sources</strong> holds <strong>Package index path</strong> and <strong>Keep the in-game frame canonical</strong>; most players leave both alone. <strong>Local server</strong> sets up a server on this PC. Updates are on the next page.</p>` },
        { id: "updates", title: "Updates",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Update mods</td><td>Automatic</td><td>Automatic, Notify or Off, for mods Progenitor installed.</td></tr>
<tr><td>Major versions</td><td>Notify</td><td>Whether Automatic also takes 2.0 over 1.x.</td></tr>
<tr><td>Offer updates before joining a server</td><td>On</td><td>Asks <strong>Update first</strong>, <strong>Join anyway</strong> or <strong>Cancel</strong>.</td></tr>
<tr><td>Update Progenitor</td><td>Automatic</td><td>Progenitor updates itself from GitHub.</td></tr></tbody></table>
<ul><li>Per mod: its page, <strong>Updates</strong>: Default, Automatic, Notify, Off or <strong>Keep &lt;version&gt;</strong>.</li><li>Old versions are kept; a failed update rolls back. The title screen says <em>N mods updated</em>.</li></ul>
<p><strong>Progenitor's own updates.</strong> Progenitor installed from its release zip updates itself at the title screen. Some updates load at the next start. An update that needs both sides to match waits for you: click <strong>Update</strong> on its row in <strong>Install Mods</strong>.</p>
<ul><li>Installed with a mod manager, or with changed files: you're told about new versions; update the way you installed it.</li>
<li>No automatic updates yet? Click <strong>Update</strong> on the Progenitor row once; it updates itself after that.</li>
<li>On 2026.10.162? Install the next release by hand once, as on <a href="#players/install">Install Progenitor</a>. Progenitor updates itself from then on.</li></ul>` }
      ]
    },

    /* ---------------- Players: Install Mods ---------------- */
    {
      id: "install", role: "players", title: "Install Mods", pages: [
        { id: "simple", title: "Simple view", shot: { src: "img/install-simple.webp", alt: "The Install Mods tab in Simple view, listing Thunderstore's mods" },
          html: `<ul><li>One row per mod, with one button.</li>
<li><strong>Show</strong> picks All, Installed or Updates. Click a column header to sort.</li>
<li><em>Loads at next start</em> or <em>Removed at next start</em> means the change waits for a restart.</li>
<li>The button acts on this PC, and on the joined server too when you are its [[admin|admin]].</li>
<li>Under the search, a line names the server and whether you are connected. On a server, <strong>Server settings &raquo;</strong> opens the [[server-tab|Server]] tab.</li>
<li>Simple picks your PC, the server or both from what the mod needs and what is already installed; the confirmation says where. For each side on its own, use Advanced.</li></ul>` },
        { id: "advanced", title: "Advanced view",
          html: `<ul><li>Separate <strong>Client</strong> and <strong>Server</strong> columns, each with its own button.</li>
<li><strong>Server</strong> picker: the connected server, a server on this PC, private games, or none.</li>
<li>More filters: <strong>Side</strong>, <strong>Show</strong> and <strong>Only</strong>. <strong>Clear filters</strong> resets them.</li></ul>
<p>Switch views at the left of the search box, or in Preferences (Install view).</p>` },
        { id: "row", title: "A mod's row",
          html: `<p>Click a row for the mod's description, latest version, side and what it requires. On an installed mod's page, <strong>View in Install Mods</strong> opens its row here; <strong>Configure in Mods</strong> on the row goes back to its page.</p>
<ul><li><strong>Install</strong>, <strong>Update</strong>, <strong>Uninstall</strong> and <strong>Install on both</strong> ask first. <em>· restart</em> means it loads at the next start.</li>
<li>Mods it needs install with it.</li><li><strong>Share</strong> on hover, or <strong>Copy link</strong>, makes a [[mod-link|mod link]] for chat.</li>
<li><strong>Updates</strong> band: <strong>Update all</strong>, or <strong>Keep 1.2.0</strong> on a row (<strong>Unpin</strong> undoes it).</li></ul>` },
        { id: "source", title: "Where mods come from",
          html: `<p>Install Mods lists [[thunderstore|Thunderstore]]'s V Rising mods. Turn it off with <strong>Use Thunderstore</strong> in Preferences.</p>
<ul><li>Packages over the download limit read <em>Too large to install</em>; tools that aren't mods read <em>Tool, not a plugin</em>.</li>
<li>Uninstall removes only files Progenitor installed.</li></ul>` }
      ]
    },
    /* ---------------- Players: Keybinds ---------------- */
    {
      id: "keybinds", role: "players", title: "Keybinds", pages: [
        { id: "tab", title: "The Keybinds tab", shot: { src: "img/keybinds-tab.webp", alt: "The Keybinds tab listing Progenitor's keys" },
          html: `<p>Every mod's keys, then the game's own, in one list. Hover a row to see what it does.</p>
<ul><li><strong>Show</strong>: All, <strong>Conflicts N</strong> or Changed.</li><li><strong>&darr; Mod keys</strong>, <strong>&darr; Game keys</strong> and <strong>Jump to mod</strong> move through the list.</li>
<li>Search by action, key or mod name.</li>
<li>Each mod's page has the same keys under <strong>Keys</strong>; a change in one shows in the other.</li></ul>` },
        { id: "remap", title: "Change a key",
          html: `<ol><li>Click the key on the row and press the new key or chord (<span class="kbd">Ctrl</span>, <span class="kbd">Shift</span>, <span class="kbd">Alt</span> allowed). <span class="kbd">Escape</span> cancels.</li>
<li>The bar says whether it is free. A key something else has: <strong>Save</strong> takes it and unbinds the other; <strong>Swap</strong> trades the two keys when it can.</li>
<li><strong>Save</strong>, <strong>Unbind</strong> or <strong>Cancel</strong>.</li></ol>
<ul><li>The reset arrow puts one row back to its default; <strong>Reset all mod keys</strong> does every mod key, never the game's.</li>
<li>Keys Windows or Steam keep (<span class="kbd">Alt+F4</span>) are refused.</li>
<li><span class="kbd">Ctrl</span>, <span class="kbd">Shift</span> or <span class="kbd">Alt</span> on its own: press and release it without another key. Only a mod key that works while you hold it takes one; any other mod key, and a mod's own config-file key, refuses it and keeps waiting. The game also uses <span class="kbd">Alt</span>, <span class="kbd">Ctrl</span> and <span class="kbd">Shift</span> alone (Advanced Tooltip, the action wheel, Cliff Jump), so holding one does both the game's action and the mod's.</li>
<li>Mouse: Middle Mouse, Mouse Back and Mouse Forward work as keys; Left and Right Mouse with a modifier.</li>
<li>Controller: on keys made with Progenitor, the second key on the row is the controller button (a mod's own config-file keys have none). Click it, then press a button, or hold one and press another; it is taken when you let go. Any button can be chosen, B too. <span class="kbd">Escape</span>, clicking elsewhere or waiting 5 seconds cancels. Press the button you hold first. A button the game already uses there is refused. Only Share map location has one to start with.</li></ul>` },
        { id: "conflicts", title: "Conflicts",
          html: `<p>Two keys conflict only on the exact same chord, in the same place. Who keeps the key:</p>
<ol><li>The game's own keys.</li><li>Progenitor's keys.</li><li>Between mods, the one installed first.</li></ol>
<ul><li>The other key is <strong>not active</strong>: its row says why, the Mods list marks the mod, and <strong>Conflicts N</strong> lists it. Click its key to pick another.</li>
<li>A mod that reads keys from its own config file still fires. Progenitor can't stop it, and the row says so.</li>
<li><span class="kbd">Alt</span>, <span class="kbd">Ctrl</span> or <span class="kbd">Shift</span> alone is shared with the game and with keys from a mod's own config file: both act on it, neither loses it, and it isn't counted as a conflict. Between two mods' Keybinds keys on it, the one installed first keeps it.</li>
<li>A conflict clears as soon as either key changes or its mod is removed.</li></ul>` },
        { id: "dialog", title: "The Key conflict dialog",
          html: `<p>When a mod loads wanting a taken key, <strong>Key conflict: &lt;mod&gt;</strong> asks once. It names the key, the mod that holds it and why that one comes first. It never interrupts play: it waits until you next open the Mods menu or go back to the title screen. Until then the key stays off and the Mods list marks the mod.</p>
<table><thead><tr><th class="label">Choice</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Pick a new key for &lt;action&gt;</td><td>Opens the Keybinds tab, ready to press a key for the new mod.</td></tr>
<tr><td>Give &lt;key&gt; to &lt;action&gt;</td><td>The new mod gets the key; the holder's action is unbound. Only offered against another mod.</td></tr>
<tr><td>Leave &lt;action&gt; unbound</td><td>The new mod's action gets no key; the holder keeps it.</td></tr>
<tr><td>Later (or Escape)</td><td>Nothing is saved; it asks again at the next start.</td></tr></tbody></table>` },
        { id: "scopes", title: "Where a key works",
          html: `<p>A key only conflicts with keys that act in the same place. The row says which:</p>
<table><thead><tr><th class="label">Place</th><th class="label">Works</th></tr></thead><tbody>
<tr><td>gameplay</td><td>In the world: most mod keys and the game's.</td></tr>
<tr><td>menus</td><td>Only while the Mods menu is open.</td></tr>
<tr><td>map</td><td>Only while the world map is open.</td></tr>
<tr><td>menus and windows</td><td>Progenitor's window keys (Back, Forward); a mod's key on the same chord always wins.</td></tr>
<tr><td>while &lt;panel&gt; is open</td><td>Only while that mod's panel is open. If the panel holds your controls while it is open, the game's own keys don't conflict with it: <span class="kbd">Space</span> can keep a preview open even though the game uses it to respawn. Grouped under the panel's name.</td></tr>
<tr><td>photo mode</td><td>Only inside [[photo-mode|photo mode]].</td></tr>
<tr><td>chat</td><td>Only while typing in chat.</td></tr></tbody></table>
<p>A game key used only while building or in the emote menu warns instead of conflicting: both fire there.</p>` },
        { id: "progenitor-keys", title: "Progenitor's keys",
          html: `<table><thead><tr><th class="label">Key</th><th class="label">Default</th><th class="label">Does</th></tr></thead><tbody>
<tr><td>Open Mods menu</td><td><span class="kbd">F10</span></td><td>Opens or closes the Mods menu.</td></tr>
<tr><td>Release input</td><td><span class="kbd">Ctrl+Shift+F12</span></td><td>Every mod lets go of your character's controls.</td></tr>
<tr><td>Navigate back / forward</td><td>Mouse Back / Forward</td><td>Back and forward in menus and window tabs.</td></tr>
<tr><td>Navigate back / forward keys</td><td><span class="kbd">Alt+Left</span> / <span class="kbd">Alt+Right</span></td><td>The same, on the keyboard.</td></tr>
<tr><td>Photo mode</td><td><span class="kbd">Ctrl+Shift+F9</span></td><td>Enters or leaves [[photo-mode|photo mode]].</td></tr>
<tr><td>Chat keys</td><td><span class="kbd">Tab</span>, <span class="kbd">Up</span>, <span class="kbd">Down</span>, <span class="kbd">Enter</span></td><td>Complete, recall, send long lines (chat only).</td></tr>
<tr><td>Teleport to map point</td><td><span class="kbd">Ctrl+Shift+Left click</span></td><td>[[admin|Admins]] with the debug buff: hold it over the open map for a second to go there (map only). Over a castle you land on its ground floor.</td></tr></tbody></table>
<p>Also on <strong>Mods &rsaquo; Progenitor &rsaquo; Keys</strong>.</p>` }
      ]
    },
    /* ---------------- Players: In the game ---------------- */
    {
      id: "game", role: "players", title: "In the Game", pages: [
        { id: "build-search", title: "Build menu search", shot: { src: "img/game-build-search.webp", alt: "The build menu filtered to candles by Search buildings", caption: "Typing <em>candle</em> finds 16 buildings." },
          html: `<ul><li>The build menu gets a <strong>Search buildings</strong> box. Type to filter the current tab by name.</li>
<li><span class="kbd">Enter</span> keeps the filter and returns to the game; <span class="kbd">Escape</span> or <strong>&times;</strong> clears it. With text in the box, one <span class="kbd">Escape</span> clears the search and keeps the build menu open; the next one closes it as usual.</li>
<li>Item tooltips show where to find the item in the menu.</li>
<li>While the box has text, the category buttons are grayed out. Clear the search to browse them again.</li></ul>
<p><strong>Recent.</strong> The <strong>Recent</strong> category, below the others, lists the buildings you placed most recently, newest first. Placing one again moves it back to the top. Type in the search box while Recent is open to search only your recent buildings. Recent fills in only on a server that runs Progenitor too.</p>
<p><strong>Copy building.</strong> With the build menu open, point at a building and press <span class="kbd">Middle Mouse</span>. The menu jumps to that building, ready to place another one. Copy building puts the item's name in the search box so you can see what you picked. It copies whatever the build cursor is on, so aim at the object itself: for a decoration standing on a floor, aim at the decoration, not the floor around it. If the box shows the floor or a wall, point at the object again. The key is shown with the game's own hints at the bottom of the screen. Change it in the <strong>Keybinds</strong> tab, under <strong>Progenitor &rsaquo; Build mode</strong>. You can put it on a key another mod already uses: it works in the build menu, and the other mod's key keeps working everywhere else.</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Build menu search</td><td>On</td><td>The search box.</td></tr>
<tr><td>Clear the search on close</td><td>On</td><td>Empties the box when the build menu closes.</td></tr>
<tr><td>Breadcrumbs</td><td>On</td><td>The "where to find it" line in tooltips.</td></tr>
<tr><td>Recent buildings</td><td>10</td><td>How many buildings Recent remembers, up to 50.</td></tr></tbody></table>
<p><strong>Mods &rsaquo; Progenitor &rsaquo; Build menu</strong>.</p>` },
        { id: "dye-all", title: "Dye all", shot: { src: "img/game-dye-all.webp", alt: "Character, Equipment with the dye colors open; every armor piece took the held color" },
          html: `<ol><li>Open <strong>Character &rsaquo; Equipment</strong> and the dye colors.</li><li>Hold a color swatch for a second.</li><li>Every piece you can see takes that color.</li></ol>
<p>Where a transmog shows, the transmog is dyed and the armor under it keeps its color. A slot you hid, or a broken piece, stays as it is. A click still colors only the selected piece.</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Dye all on hold</td><td>On</td><td>Holding a swatch dyes every piece you can see. <strong>Mods &rsaquo; Progenitor &rsaquo; Equipment</strong>.</td></tr></tbody></table>` },
        { id: "photo-mode", title: "Photo mode", shot: { src: "img/game-photo-mode.webp", alt: "A castle seen from photo mode's free camera, the HUD hidden" },
          html: `<p>A free camera with the HUD hidden. Turn on <strong>Photo mode</strong> under <strong>Mods &rsaquo; Progenitor &rsaquo; Photo mode</strong>, then press <span class="kbd">Ctrl+Shift+F9</span> to enter and leave.</p>
<table><thead><tr><th class="label">Key</th><th class="label">Does</th></tr></thead><tbody>
<tr><td><span class="kbd">W</span> <span class="kbd">A</span> <span class="kbd">S</span> <span class="kbd">D</span>, <span class="kbd">E</span> up, <span class="kbd">Q</span> down</td><td>Fly</td></tr>
<tr><td>Hold right mouse; the wheel</td><td>Look around; flying speed</td></tr>
<tr><td>Hold <span class="kbd">R</span> / <span class="kbd">F</span></td><td>Fly faster / slower</td></tr>
<tr><td><span class="kbd">Z</span> / <span class="kbd">X</span></td><td>Zoom in / out</td></tr>
<tr><td><span class="kbd">H</span></td><td>Hide or show the HUD</td></tr>
<tr><td>Middle mouse</td><td>Hold to target a unit, release to lock on, tap to unlock</td></tr>
<tr><td><span class="kbd">P</span></td><td>Pause the world ([[admin|admins]] only)</td></tr>
<tr><td><span class="kbd">Escape</span></td><td>Leave</td></tr></tbody></table>
<p>All remappable in the Keybinds tab, group Photo mode.</p>` },
        { id: "photo-settings", title: "Photo mode settings",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Photo mode</td><td>Off</td><td>Lets <span class="kbd">Ctrl+Shift+F9</span> enter photo mode.</td></tr>
<tr><td>Hide the HUD on entry</td><td>On</td><td>Starts with the HUD hidden; <span class="kbd">H</span> toggles it.</td></tr>
<tr><td>Hide nameplates with the HUD</td><td>On</td><td>Also hides nameplates, health bars and combat text.</td></tr>
<tr><td>Look speed</td><td class="num">1</td><td>Mouse-look speed.</td></tr></tbody></table>
<p>A server can turn photo mode off.</p>` },
        { id: "character-sheet", title: "Character sheet",
          html: `<p>The game's Character sheet gets extra stat lines with tooltips: resource power, siege power, movement speed, resistances, cooldown recovery and more.</p><p>No setting.</p>` },
        { id: "history", title: "Back and forward",
          html: `<ul><li>Mouse <strong>Back</strong> / <strong>Forward</strong>, or <span class="kbd">Alt+Left</span> / <span class="kbd">Alt+Right</span>, step through where you have been in the Mods menu.</li>
<li>The same keys step through the tabs of the game's full-screen menu (map, spellbook, social and the rest) and of mod windows with tabs.</li></ul>
<p>Remap them in the Keybinds tab: Navigate back, Navigate forward.</p>` },
        { id: "chest-windows", title: "Mod windows over a chest",
          html: `<ul><li>A mod window opened from a chest or station (a Find list, a log) leaves that chest's window open underneath.</li>
<li><span class="kbd">Escape</span> closes the mod window first; press it again to close the chest. Typing in a mod's search box doesn't close the chest.</li>
<li>On a mod's own tab inside the chest or station window, <span class="kbd">Escape</span> closes the whole window, as on the game's tabs.</li>
<li>A mod can bring back the chest you had open after it showed you another one, as long as you're still standing where you were. A chest you close yourself stays closed. If you walked away, a mod may open that chest from afar instead, to look only.</li>
<li>When a mod asks you to pick chests in the world, a second line under the prompt can name a key to hold, such as <span class="kbd">Shift</span>, for a different choice. Keep it held to mark several picks in a row; let go before a pick that should not have it.</li></ul>` },
        { id: "release-input", title: "Release input",
          html: `<p>A mod holding your character's controls (a camera, a tool) and you can't get out? Press <span class="kbd">Ctrl+Shift+F12</span>: every mod lets go of your input.</p>` },
        { id: "locked-containers", title: "Locked containers",
          html: `<p>A mod can lock a chest or a station with a password.</p>
<ol><li>Open it as usual. A locked one asks for its password instead of opening.</li>
<li>Type the password (it shows as stars) and press <strong>OK</strong>. It opens.</li></ol>
<ul><li>A wrong password shows a short message and nothing opens. Open it again to try again.</li>
<li>Once it has opened for you, it usually stays unlocked for you until you leave the server, depending on the mod.</li>
<li>Some locks offer <strong>Remember password</strong>: tick it and that mod lets you in without asking next time, until the password changes.</li>
<li>Showing a chest from afar asks for the same password.</li>
<li>The box names the mod that asks. Don't use a password you use anywhere else.</li></ul>` },
        { id: "private-games", title: "Private games",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Load Progenitor in the private games I host</td><td>On</td><td>Server-side mods load in your private and single-player games too. Applies at the next private-game start.</td></tr></tbody></table>
<p><strong>Mods &rsaquo; Progenitor &rsaquo; Private games</strong>.</p>` },
        { id: "uninstall", title: "Remove Progenitor",
          html: `<ol><li><strong>Mods &rsaquo; Progenitor &rsaquo; Private games &rsaquo; Remove Progenitor from this PC &rsaquo; Uninstall</strong>, and confirm.</li>
<li>The page shows <strong>Removal requested</strong>.</li>
<li>The next time you start the game, Progenitor removes itself and every mod it installed. BepInEx stays.</li></ol>
<p>Changed your mind? <strong>Cancel the removal</strong> (<strong>Keep Progenitor</strong>) before you restart.</p>
<p>Game won't start, or no Mods menu? Quit the game, open <strong>PowerShell</strong> and run the remover instead:</p>{{code}}
<p>It moves Progenitor's files, its settings, the mods it installed and every mod in its <code>progenitor-reload</code> folder (also ones you copied there yourself) to <code>BepInEx\\progenitor-backups</code>. Your saves and BepInEx stay. Read it first at <a href="https://vrising-modders.github.io/Progenitor/uninstall.ps1">vrising-modders.github.io/Progenitor/uninstall.ps1</a>.</p>`,
          code: { lang: "powershell", text: `irm https://vrising-modders.github.io/Progenitor/uninstall.ps1 | iex` } }
      ]
    },

    /* ---------------- Server admins ---------------- */
    {
      id: "admins", role: "admins", title: "Getting Started", pages: [
        { id: "install", title: "Install on a server",
          html: `<ol><li>Copy everything inside <code>BepInExPack_V_Rising</code> into the server folder, next to <code>VRisingServer.exe</code>.</li>
<li>With the server stopped, extract <code>Progenitor-&lt;version&gt;.zip</code> from the <a href="https://github.com/VRising-Modders/Progenitor/releases/latest">latest release</a> into the same folder. It is one package for client and server. Progenitor then tells you about its own updates from GitHub (<a href="#admins/mods/updates">Server updates</a>); to update by hand, extract the new zip the same way.</li>
<li>Start the server once; the first start is slow while BepInEx generates its files.</li></ol>
<p>Or stop the server, open <strong>PowerShell</strong>, paste this line and press Enter. It does both steps in the server Steam installed:</p>{{code}}
<p>Server somewhere else? Add <code>-GamePath "D:\\Servers\\VRising"</code> (your server's folder) to the end of that line.</p>
<p>A private game hosted from a client loads the client's mods; no separate install.</p>`,
          code: { lang: "powershell", text: `& ([scriptblock]::Create((irm https://vrising-modders.github.io/Progenitor/install.ps1))) -Server` },
          callout: { title: "Never on a public server", warn: true, text: "Don't put <code>Progenitor.Dev.dll</code> (the [[dev-bridge|dev bridge]]) on a public server. Release packages don't include it." } },
        { id: "admins", title: "Who is an admin",
          html: `<ul><li>Players on the server's admin list, or authenticated with <code>adminauth</code>.</li>
<li>The host of a private game.</li>
<li>All admins are equal: any admin may change any setting.</li>
<li>To stop that, [[config-lock|lock]] groups in the server's <code>progenitor.cfg</code>: <code>[ServerSettings] LockedInGame</code>.</li></ul>` },
        { id: "server-tab", title: "The Server tab", shot: { src: "img/admins-server-tab.webp", alt: "The Server tab on a server, open at When players join" },
          html: `<p>Join your server, open <strong>Mods</strong>, then the [[server-tab|Server]] tab. Admins edit; everyone else reads. The top of the tab shows the server's full name and whether you have admin or read-only access; hover or pick a setting to read its help.</p>
<ul><li><a href="#admins/joining/popup">Mods players need</a>: required and recommended client mods.</li>
<li><a href="#admins/rules/rules">Server rules</a>, <a href="#admins/backups/backups">backups</a>, <a href="#admins/chat/allow">chat</a> and <a href="#admins/mods/updates">updates</a>.</li>
<li>Each mod's server settings sit on its own page under <strong>Server settings</strong>.</li></ul>
<p>The next chapters cover every group and setting.</p>` },
        { id: "help", title: "When something goes wrong",
          html: `<ul><li><code>.progenitor logs</code> in chat collects the server's logs.</li>
<li>Bugs: a <a href="https://github.com/VRising-Modders/Progenitor/issues/new?template=bug-report.yml">GitHub bug report</a> or the <a href="https://discord.com/channels/978094827830915092/1112888087836631090">Progenitor channel</a> on the V Rising Mod Community Discord (<a href="https://vrisingmods.com/discord">join it</a> first).</li>
<li>For the fastest help, <a href="#help/ai-help">ask an AI assistant (ChatGPT, Gemini, Grok, Claude&hellip;) with our ready-made prompt &rarr;</a></li></ul>` }
      ]
    },
    /* ---------------- Server admins: reference ---------------- */
    {
      id: "admins/server-tab", role: "admins", title: "Server Tab", pages: [
        { id: "groups", title: "The groups",
          html: `<p><strong>Mods &rsaquo; Server</strong>, while joined. In order:</p>
<ol><li><strong>When players join</strong>: the server message.</li><li><strong>Mods players need</strong>: join rules.</li><li><strong>Server listing</strong>: name and description.</li>
<li><strong>Server rules &middot; applied at the next restart</strong>, with backups.</li><li><strong>Chat on this server</strong>.</li><li><strong>Players without Progenitor</strong>.</li><li><strong>Updates</strong>.</li><li><strong>Operator</strong>.</li></ol>
<p>Players who aren't admins see these rows marked <em>Admin only</em> and can't change them. After each edit the row says <em>Saved by the server</em>, or why the server refused it.</p>` },
        { id: "on-this-server", title: "Progenitor's own server switches",
          html: `<p><strong>Mods &rsaquo; Progenitor &rsaquo; On this server</strong> (admins only), then the link <em>This server's setup is in the Server tab.</em></p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Allow photo mode on this server</td><td>On</td><td>Off: nobody can use [[photo-mode|photo mode]] here. Applies at once.</td></tr>
<tr><td>Ally-safe hits</td><td>On</td><td>Units a mod spawns through Progenitor don't hit their allies. The game's own units and bosses are unchanged.</td></tr>
<tr><td>Remote chest preview</td><td>PvE servers only</td><td>Lets a mod show players a chest, or a crafting, refining or salvage station, in their own or their clan's castle from anywhere, to look inside only: nothing can be taken, moved or started that way. Off, PvE servers only (off while the server is PvP) or On. Turning it off closes any chest or station a player is looking at.</td></tr></tbody></table>
<p>Each other mod's server settings are on its own page under <strong>Server settings</strong>.</p>` },
        { id: "message", title: "When players join",
          html: `<ul><li><strong>Message</strong>: up to 2,000 characters, with <strong>Insert</strong> for a countdown or the reset date, a <strong>Players see</strong> preview and <strong>Apply</strong>.</li>
<li><strong>Next reset</strong>: a date for hand wipes, or the game's wipe schedule.</li>
<li><strong>Show the message</strong>: When it changes or after a reset (default), Every join, First join only.</li>
<li><strong>Show the mods page</strong>: When needed (default), Every join.</li></ul>
<p>One click on <strong>Apply</strong> saves the text as it stands, tokens included. If another admin changes the message while you're on the page, the field shows their text. If you were in the middle of your own edit, your text stays and the row says <em>This setting changed on the server</em> on that Apply; apply again to replace their text with yours.</p>
<p>Players in the world get a <em>Server update</em> notice when the message changes. You don't get one for your own Apply; a change someone else makes still shows it to you.</p>` },
        { id: "listing", title: "Server listing",
          html: `<table><thead><tr><th class="label">Row</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Server name</td><td></td><td>The Join Game name; up to 64 characters. Next restart.</td></tr>
<tr><td>Server list description</td><td>Empty</td><td>Up to 128 characters in the server browser.</td></tr>
<tr><td>Progenitor signature</td><td>On</td><td>Adds a line saying the server needs Progenitor.</td></tr>
<tr><td>Status</td><td></td><td>Whether the description is published.</td></tr></tbody></table>` },
        { id: "locks", title: "Lock settings",
          html: `<p>All admins are equal. To keep a setting out of every admin's hands, list it in the server's <code>progenitor.cfg</code>:</p>{{code}}
<ul><li>Group words: <code>server-rules</code>, <code>operator</code>, <code>gameplay</code>, <code>server-list</code>, <code>join</code>, <code>mods-players-need</code>, <code>no-progenitor</code>, <code>chat</code>, <code>updates</code>; <code>*</code> for everything.</li>
<li>Or one setting's id, such as <code>progenitor/ServerRules/ClanSize</code>.</li>
<li>A locked row reads <em>Locked in the server's config file</em>. Changes apply at once.</li></ul>`,
          code: { lang: "ini", text: `[ServerSettings]
LockedInGame = server-rules, updates` } }
      ]
    },
    {
      id: "admins/joining", role: "admins", title: "Players Joining", pages: [
        { id: "popup", title: "Required and recommended mods",
          html: `<p><strong>Mods players need &rsaquo; Players joining this server &rsaquo; Open</strong>. Edits wait for <strong>Apply</strong>.</p>
<ul><li><strong>Required client mods</strong> (up to 16): players need them to join; the server needn't run them. Rule per mod: <em>&lt;v&gt; or newer</em> (default), <em>Exact</em>, <em>Same minor</em>, <em>Any version</em>.</li>
<li><strong>Recommended client mods</strong>: shown with your reason (up to 120 characters).</li>
<li><strong>Which client mods players may use</strong>: <strong>Any mods</strong> (default) or <strong>Only approved mods</strong> (<strong>Approve everything I have</strong> fills the list).</li>
