<li><strong>Seconds to install needed mods</strong>: 60. Players can install from the join screen and still join.</li></ul>`,
          callout: { title: "House rules, not anti-cheat", text: "Players' games report their own mods." } },
        { id: "rules", title: "Join rules",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Version matching</td><td>Use each mod's declared range</td><td>Or Same minor for all, Exact version for all.</td></tr>
<tr><td>Rules for one mod</td><td>None</td><td>Read only; set per mod in the popup.</td></tr>
<tr><td>Mods break rules while playing</td><td>Pause the mod and warn them</td><td>Or Disconnect them.</td></tr>
<tr><td>Seconds to fix a mod</td><td class="num">60</td><td>10 to 300, with Disconnect them.</td></tr>
<tr><td>If mods can't be checked</td><td>Let them join</td><td>Or Refuse them; only with Only approved mods.</td></tr></tbody></table>
<p>All apply from each player's next join.</p>` },
        { id: "no-progenitor", title: "Players without Progenitor",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Message without Progenitor</td><td>Default text</td><td>Chat message to them, up to 300 characters; <code>{mods}</code>, <code>{seconds}</code>.</td></tr>
<tr><td>Players without Progenitor</td><td>Let them play</td><td>Or Keep them out.</td></tr>
<tr><td>Seconds before disconnect</td><td class="num">20</td><td>0 to 300; 0 is no deadline.</td></tr>
<tr><td>First notice after (seconds)</td><td class="num">5</td><td>When the message first shows (Operator group).</td></tr>
<tr><td>Repeat notice every (seconds)</td><td class="num">3</td><td>How often it repeats.</td></tr>
<tr><td>Creation time limit (seconds)</td><td class="num">600</td><td>The longest the countdown waits during character creation.</td></tr></tbody></table>` },
        { id: "what-players-see", title: "What players see",
          html: `<ol><li><strong>Welcome to &lt;server&gt;</strong>: your message and a summary.</li>
<li><strong>Mods for &lt;server&gt;</strong>: <strong>Required to join</strong> (<em>N of M ready</em>) and <strong>Recommended</strong>, each with Install, Update or Turn on.</li>
<li>Missing a required mod: the join is held while they install, then <strong>Join now</strong> or <strong>Restart and rejoin</strong>. Otherwise it is refused with the mods named.</li></ol>
<p>When your list changes, players in the world get a <em>Server update</em> notice.</p>
<p>A mod you add to the server while players are on it never disconnects them, even after a Progenitor update. Players who lack it, or have another version, get a notice naming it, with <strong>Open Install Mods</strong> when they can install it. The mod's server part can then leave them out, if it checks which players have it. It is required from their next join. If a player removes a required mod themselves, the usual rules apply.</p>` }
      ]
    },
    {
      id: "admins/rules", role: "admins", title: "Server Rules", pages: [
        { id: "rules", title: "Server rules",
          html: `<p><strong>Server rules &middot; applied at the next restart</strong>: the game's own settings. <strong>Pending changes</strong> lists what waits for a restart.</p>
<table><thead><tr><th class="label">Rule</th><th class="label">Choices</th></tr></thead><tbody>
<tr><td>Game mode</td><td>PvP, PvE</td></tr>
<tr><td>Clan size</td><td>1 to 10</td></tr>
<tr><td>Difficulty</td><td>Easy (Relaxed), Normal, Hard</td></tr>
<tr><td>Blood-bound equipment</td><td>On, Off (off lists the server as Merciless)</td></tr>
<tr><td>Castle heart damage</td><td>Only when decaying, Players can destroy it, Players can seize or destroy it</td></tr>
<tr><td>Password</td><td>Up to 32 characters; applies at once; never shown</td></tr>
<tr><td>Max players</td><td>Player slots; with admin slots at most 128</td></tr></tbody></table>
<p><strong>Preset</strong> warns when a preset overrides a row.</p>` },
        { id: "wipes", title: "Scheduled wipes",
          html: `<ul><li><strong>Scheduled wipes every (days)</strong>: 0 (never) to 365. The game archives the world and starts a new one.</li>
<li><strong>Wipe on</strong>: a weekday, or Any. With no scheduled wipe, the day is saved for later: <em>Wipe on Saturday · takes effect once a wipe is scheduled</em>.</li><li><strong>Next wipe</strong>: pick the date; Progenitor sets the days. Asks you to confirm.</li></ul>
<p>Read only: <strong>Next scheduled wipe</strong>, <strong>Listed as Merciless</strong>, <strong>Territory (read only)</strong>, <strong>Days running (read only)</strong>, <strong>Standard settings (read only)</strong>.</p>` }
      ]
    },
    {
      id: "admins/backups", role: "admins", title: "Backups and Restores", pages: [
        { id: "backups", title: "Backups",
          html: `<p>Under Server rules, admins only.</p>
<table><thead><tr><th class="label">Row</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Back up the world now</td><td></td><td><strong>Back up now</strong>: a checked copy while the server runs.</td></tr>
<tr><td>Last backup</td><td></td><td>Progress while a backup runs, then its result. <strong>Backups</strong> counts the new restore point.</td></tr>
<tr><td>Back up at every server start</td><td>Off</td><td>A copy before the world loads.</td></tr>
<tr><td>Back up every</td><td class="num">0</td><td>Hours, up to 168; 0 is off.</td></tr>
<tr><td>Keep backups per kind</td><td class="num">10</td><td>0 is no limit.</td></tr>
<tr><td>Delete backups older than</td><td class="num">0</td><td>Days; 0 is no limit.</td></tr>
<tr><td>Keep Progenitor backups</td><td class="num">5</td><td>The backups made before restores; 0 keeps all.</td></tr></tbody></table>` },
        { id: "restore", title: "Restore an earlier world",
          html: `<ol><li><strong>Restore an earlier world &rsaquo; Show</strong>: every [[restore-point|restore point]], wipe archives and backups.</li>
<li>Pick one. If its wipe date has passed: restart the wipe clock, turn wipes off, or pick a new date.</li>
<li>Type <code>RESTORE</code>, then <strong>Restore at next restart</strong> or <strong>Restore and restart now</strong> (players are warned).</li></ol>
<ul><li>The current world is backed up first. <strong>Restore pending</strong> shows the request; <strong>Cancel the restore</strong> drops it.</li>
<li><strong>Last restore</strong> says how it went. Progenitor never starts the server again; your host does.</li></ul>`,
          callout: { title: "Not supported yet", text: "Restoring in a hosted private game, or from an autosave." } }
      ]
    },
    {
      id: "admins/chat", role: "admins", title: "Chat Moderation", pages: [
        { id: "allow", title: "What chat allows",
          html: `<p><strong>Chat on this server</strong>, sent to every player:</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Allow clickable links</td><td>On</td><td>Web links in chat.</td></tr>
<tr><td>Allow mod links</td><td>On</td><td>[[mod-link|Mod links]] and mod suggestions.</td></tr>
<tr><td>Allow @all from admins</td><td>On</td><td>Highlights an admin's <code>@all</code> for everyone.</td></tr>
<tr><td>Allow long messages</td><td>On</td><td>Lines sent in parts.</td></tr>
<tr><td>Longest long message</td><td class="num">1000</td><td>Characters, 200 to 4000.</td></tr></tbody></table>` },
        { id: "filter", title: "Word filter",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Word filter</td><td>Off</td><td>Checks every player line on the server.</td></tr>
<tr><td>Filtered words</td><td>Empty</td><td>Comma separated, whole words, any case ("ass" doesn't match "class"). Never sent to players.</td></tr>
<tr><td>When a word matches</td><td>Replace with ***</td><td>Or <strong>Block the message</strong>: only the sender is told.</td></tr></tbody></table>
<p>Players' own profanity filter is separate.</p>` },
        { id: "relay", title: "Discord relay",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Discord relay</td><td>Off</td><td>Posts chosen channels as <em>Name: message</em>.</td></tr>
<tr><td>Discord webhook address</td><td>Empty</td><td>From Discord: channel settings &rsaquo; Integrations &rsaquo; Webhooks. Reads only Set or Not set.</td></tr>
<tr><td>Relay Global chat</td><td>On</td><td rowspan="2">Public channels.</td></tr><tr><td>Relay System lines</td><td>On</td></tr>
<tr><td>Relay Local chat</td><td>Off</td><td></td></tr>
<tr><td>Relay clan chat</td><td>Off</td><td rowspan="2">Players expect these to be private.</td></tr><tr><td>Relay whispers</td><td>Off</td></tr></tbody></table>
<p>Nothing pings in Discord; at most one post a second.</p>` },
        { id: "reload-messages", title: "Mod reload messages",
          html: `<p>When Progenitor or a mod [[hot-reload|hot-reloads]] on the server, everyone online sees one System line, such as <em>Server hot load: MyMod reloaded (2.0.0).</em> A deploy of several mods at once shares one line. Nothing is said when the server starts. At most one line goes out every 30 seconds, and the same news isn't repeated within 3 minutes.</p>
<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Announce mod reloads</td><td>On</td><td>Off: no line for anyone. Players can also hide these lines for themselves.</td></tr></tbody></table>` }
      ]
    },
    {
      id: "admins/mods", role: "admins", title: "Server Mods and Updates", pages: [
        { id: "remote-install", title: "Install mods on the server",
          html: `<p>Joined as an admin, [[remote-install|Install Mods]] installs, updates and removes mods on the server: <strong>Install on server</strong>, <strong>Install on both</strong>, <strong>Update on server</strong>.</p>
<ul><li>The server downloads the mod itself. Some mods load at once; others show <em>Pending server restart</em>.</li>
<li>For a server on this PC or your private game, the mod goes straight into its folder.</li></ul>
<table><thead><tr><th class="label">Operator row</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Remote mod installs</td><td>On</td><td>Off refuses every remote install.</td></tr>
<tr><td>Admins who may install mods</td><td>Any admin</td><td>SteamID64s, comma separated.</td></tr>
<tr><td>Saved mod items</td><td></td><td><strong>Manage</strong>: restore, keep or discard items of a removed mod.</td></tr></tbody></table>` },
        { id: "updates", title: "Server updates",
          html: `<table><thead><tr><th class="label">Setting</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Update server mods</td><td>Notify</td><td>Automatic, Notify or Off.</td></tr>
<tr><td>Major versions</td><td>Notify</td><td>Whether Automatic takes 2.0 over 1.x.</td></tr>
<tr><td>Restart when empty</td><td>Off</td><td>Saves and quits when nobody is on, to apply restart updates. Needs <code>[AutoUpdate] HostRestarts</code>.</td></tr>
<tr><td>Empty for</td><td class="num">5</td><td>Minutes nobody may be on first.</td></tr>
<tr><td>Back up the world before updating</td><td>Off</td><td>One backup per update batch.</td></tr>
<tr><td>Keep backups made before an update</td><td class="num">2</td><td>1 to 20.</td></tr>
<tr><td>Skip when a backup is newer than</td><td class="num">6</td><td>Hours; 0 always backs up.</td></tr></tbody></table>
<p><strong>Progenitor's own updates</strong> come from GitHub. The server tells you about them (<code>[AutoUpdate] Progenitor = Notify</code>, the default). Set it to <code>Automatic</code> to update Progenitor while nobody is on; a new Bootstrap applies at the next restart. An update that needs players to update too never installs by itself.</p>` },
        { id: "update-status", title: "Update status",
          html: `<ul><li><strong>Status</strong>: the last check, what applied, what waits. <strong>Waiting</strong> and <strong>Recent</strong> list the details.</li>
<li><strong>Look for updates now</strong> (<strong>Check now</strong>). Otherwise every 6 hours (<code>[AutoUpdate] CheckHours</code>).</li>
<li><strong>Apply the updates waiting for a restart</strong> (<strong>Restart now</strong>) warns players, saves and quits. <strong>Restart countdown</strong> (<strong>Cancel restart</strong>) stops it.</li></ul>
<p>Progenitor never starts the server again; your host or service does. Every step: <code>BepInEx/progenitor-auto-update.log</code>.</p>` },
        { id: "commands", title: "Commands",
          html: `<table><thead><tr><th class="label">Command</th><th class="label">Who</th><th class="label">Does</th></tr></thead><tbody>
<tr><td><code>.help</code></td><td>Everyone</td><td>The commands you can use.</td></tr>
<tr><td><code>.progenitor</code></td><td>Everyone</td><td>Version and loaded mods.</td></tr>
<tr><td><code>.progenitor logs</code></td><td>Admins</td><td>Saves the server's log zip in <code>BepInEx/progenitor-support</code>.</td></tr>
<tr><td><code>.stop-server</code></td><td>Admins</td><td>Saves the world and stops the server.</td></tr>
<tr><td><code>.debug on</code> / <code>.debug off</code></td><td>Admins</td><td>The debug buff: no blood drain, no damage, the whole map shown. With it on, hold <span class="kbd">Ctrl+Shift+Left click</span> over the open map for a second to teleport there. Over a castle you land on its ground floor. If the game won't let you stand there, chat says <q>Couldn't teleport there</q> and you stay put.</td></tr></tbody></table>` },
        { id: "save-safety", title: "Removing a content mod",
          html: `<p>A world saved with a content mod still loads after you remove the mod: Progenitor drops what the mod added and logs a warning. If that is more than the limits below, the world fails to load, as it would without Progenitor.</p>
<p>Settings: <code>[SaveSafety]</code> in <code>progenitor.cfg</code> (<code>DropUnknownPrefabs</code> on, <code>MaxDropPercent</code> 0.5, <code>MaxDropEntities</code> 5000). Applies after a restart.</p>` }
      ]
    },

    /* ---------------- Mod developers ---------------- */
    {
      id: "developers", role: "developers", title: "Getting Started", pages: [
        { id: "what-you-get", title: "What you get",
          html: `<div class="grid"><div><b>Settings</b>Player and server settings, with reset and sync.</div><div><b>Keybinds</b>Remappable, in the Keybinds tab.</div><div><b>Windows</b>Game-look windows, placed for you.</div>
<div><b>Hot reload</b>Rebuild and swap into the running game.</div><div><b>Networking</b>Typed client-server requests.</div><div><b>Mods page</b>Status, version, About, settings.</div></div>
<p>Everything goes through [[ctx|<code>ctx</code>]]; unload undoes it.</p>` },
        { id: "requirements", title: "What you need",
          html: `<ul><li>V Rising and <strong>BepInExPack_V_Rising</strong>. Start the game once to create <code>BepInEx\\interop</code>.</li>
<li><strong>Progenitor</strong>, in the same BepInEx folder.</li><li><strong>.NET 8 SDK</strong> and an editor.</li></ul>`,
          callout: { title: "Game elsewhere?", text: "Set <code>VRISING_GAME_DIR</code>. See the README, Building from source." } },
        { id: "folders", title: "Where the files go",
          html: `<table><thead><tr><th class="label">Folder</th><th class="label">Holds</th></tr></thead><tbody>
<tr><td><code>BepInEx/plugins/</code></td><td>[[bootstrap|Bootstrap]] only</td></tr>
<tr><td><code>BepInEx/progenitor-core/</code></td><td>[[core|Core]], <code>Progenitor.dll</code></td></tr>
<tr><td><code>BepInEx/progenitor-reload/</code></td><td><strong>Your mod's [[plugin|plugin]] DLL</strong> (the [[reload-folder|reload folder]])</td></tr></tbody></table>` },
        { id: "create-mod", title: "Create your first mod",
          html: `<p>Recommended: the starter template. It sets up the build, plugin class, a setting, a keybind and a help page.</p>{{code}}<p>Install the template from the Progenitor checkout your mod builds against, and update the two together. If the checkout is older than the template, the build stops and says so.</p>`,
          code: { lang: "shell", text: `dotnet new progenitor-mod -n MyMod
cd MyMod
dotnet build` },
          callout: { title: "Template not found?", text: "Set the project up by hand from the next two pages." } },
        { id: "project-file", title: "The project file",
          html: `<p>Inside the Progenitor repository, beside the samples:</p>{{code}}<p>Outside it, copy the game references from <code>Directory.Build.targets</code> and <code>.props</code>.</p>`,
          code: { lang: "xml", text: `<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <AssemblyName>MyMod</AssemblyName>
    <BepInExPluginGuid>com.example.mymod</BepInExPluginGuid>
    <BepInExPluginName>My Mod</BepInExPluginName>
    <ReferenceGame>true</ReferenceGame>
  </PropertyGroup>
  <ItemGroup>
    <ProjectReference Include="..\\..\\src\\Progenitor.Core\\Progenitor.Core.csproj" Private="false" />
  </ItemGroup>
</Project>` } },
        { id: "plugin-class", title: "The plugin class",
          code: { lang: "c#", text: `[BepInPlugin(MyPluginInfo.PLUGIN_GUID, MyPluginInfo.PLUGIN_NAME, MyPluginInfo.PLUGIN_VERSION)]
[BepInDependency("progenitor")]
[ProgenitorSide(Side.Both)]
public sealed class Plugin : ProgenitorPlugin<MyContext>
{
    protected override void OnLoad(MyContext ctx)
    {
        ctx.Handshake.DeclareSelf();
        if (ctx.IsServer)
            ctx.Events.On<PlayerConnected>(e => ctx.Log.LogInfo("Welcome, " + e.CharacterName));
    }
}

public sealed class MyContext : PluginContext { }` },
          callout: { title: "Keep the context constructor empty", warn: true, text: "Facades attach after it runs. Set up in <code>OnLoad</code>." } },
        { id: "build-reload", title: "Build and hot-reload it",
          html: `<ol><li>Host a private game; it shares the client's BepInEx folder.</li>
<li><code>dotnet build</code>, then copy <code>bin\\Debug\\net6.0\\MyMod.dll</code> to <code>BepInEx\\progenitor-reload\\</code>.</li>
<li>Change, build, copy. The old version unloads; the new one loads: a [[hot-reload|hot reload]].</li></ol>
<p>In the repository: build, then <code>tools/deploy.ps1 -Projects MyMod -Side server -NoBuild</code>.</p>`,
          callout: { title: "Bootstrap changes", text: "Need a restart. See the <a href=\"https://github.com/VRising-Modders/Progenitor/blob/main/docs/hot-reload.md\">hot-reload guide</a>." } },
        { id: "check-reload", title: "Check that it loaded",
          html: `<ul><li><strong>Log:</strong> <code>Reload:</code> lines in <code>BepInEx\\LogOutput.log</code> name the [[unload-reason|reason]].</li>
<li><strong>Behavior:</strong> use what you changed.</li><li><strong>Still old?</strong> Not settled yet, or refused; the log says which.</li></ul>` },
        { id: "add-setting", title: "Add a setting",
          code: { lang: "c#", text: `var showHints = ctx.Config.Bind("General", "ShowHints", true,
    "Show a hint when the window opens.");

ctx.Settings.Page(page => page
    .Section("General")
        .Toggle(showHints));` },
          html: `{{code}}<ul><li>The row shows on your Mods page, with reset and help.</li><li><strong>Pick defaults that work</strong>; most players never open settings.</li><li>One <code>Page</code> call holds all rows.</li></ul>` },
        { id: "server-settings", title: "Player and server settings",
          html: `<p>[[mod-settings|Player settings]] change one game. Server settings apply to everyone: bind them [[synced-setting|synced]] and admins edit them in game.</p>{{code}}<p>Non-admins see server rows read-only. Player settings in the same cfg still save as they change while a server holds the synced ones; the file keeps the player's own values for those.</p>
<p>A server-only mod can publish settings without a client DLL: <code>ctx.Bind(..., scope: SettingScope.ServerWide)</code> for everyone, and <code>ctx.Settings.PerPlayer(...)</code> for a value the server keeps for each player, which that player edits under <strong>Your settings on this server</strong>. Read it on the server with <code>For(userEntity)</code>. See <code>Progenitor.ReloadExample</code>.</p>
<p>Players without your DLL see these rows the way your <code>ctx.Settings.Page</code> lays them out: its labels, help, controls (switch, slider with its step and units, radio or dropdown with your choice labels), sections and order. Place a per-player setting on the page with <code>page.Toggle(playerSetting)</code> (also <code>Slider</code>, <code>Radio</code>, <code>Dropdown</code>, <code>Number</code>, <code>Text</code>, <code>Setting</code>). To hide or gray a row for them too, use a rule instead of a <code>showIf</code> function: <code>.ShowIf(enabled, true)</code>, <code>.EnableWhen(SettingCondition.AtLeast(radius, 5))</code> or <code>.ShowWhen(SettingCondition.ServerHasMod("Satisvampory"))</code>. A <code>showIf</code> function only works where your mod is installed.</p>
<p>For a list of items with a count each (a pickup filter), use <code>ctx.Settings.PerPlayerItemList(...)</code> or, one list for everyone, <code>ctx.Settings.ItemList(...)</code>, and place it with <code>page.ItemList(list)</code>. Players edit it with the item picker; the server checks every change against your <code>ItemListRules</code>. A list holds up to 256 lines.</p>`,
          code: { lang: "c#", text: `var maxStack = ctx.Bind("Server", "MaxStack", 99, "Largest stack.",
    synced: true, acceptableValues: new AcceptableValueRange<int>(1, 999));

ctx.Settings.Page(page => page
    .Section("General").Toggle(showHints)
    .Section("Server").Slider(maxStack, scope: SettingScope.Server));` } },
        { id: "add-keybind", title: "Add a keybind",
          code: { lang: "c#", text: `ctx.Keybinds.RegisterOpener("ToggleWindow", new KeyChord(UiKey.F8),
    "Open or close the My Mod window.", ToggleWindow);` },
          html: `{{code}}<ul><li><code>RegisterOpener</code>: opens or closes your UI; works at the title screen too.</li><li><code>Register</code>: acts in the world.</li><li><code>RegisterWhileShown(panel, ...)</code>: acts only while that panel is open; with <code>CaptureMode = WhileShown</code> the game's keys don't conflict with it.</li><li>Both are [[keybind|remappable]] in the Keybinds tab.</li></ul>`,
          callout: { title: "Never read keys yourself", warn: true, text: "No <code>UnityEngine.Input</code>, <code>Keyboard.current</code> or gamepad polling." } },
        { id: "show-window", title: "Show a window",
          code: { lang: "c#", text: `var window = ctx.Windows.Create(UiWindowPreset.Basic, "My Mod");
var panel = window.Panel;
panel.Text("Status", UiTextStyle.Section);
panel.Text("Version", ctx.Version, UiTextStyle.Number);
panel.Button("Close").OnClick(window.Hide);
window.Show();` },
          html: `{{code}}<ul><li>Pick a [[window-preset|preset]]: <code>Basic</code> for a small tool, <code>Header</code> for one thing the player works on (toolbar, tabs), <code>Tabbed</code> for a large screen.</li><li>The window draws its frame, centered title and version stamp, and closes on unload.</li><li>Every line takes a [[text-style|text style]].</li></ul>` },
        { id: "where-ui-lives", title: "Windows and pages",
          html: `<table><thead><tr><th class="label">Need</th><th class="label">Use</th></tr></thead><tbody>
<tr><td>Options set once</td><td><code>ctx.Settings.Page(...)</code></td></tr>
<tr><td>A screen of its own</td><td><code>ctx.Menu.Register(name, description).Page(title, ...)</code></td></tr>
<tr><td>A window during play</td><td>[[window-preset|<code>ctx.Windows.Create</code>]]: <code>Basic</code>, <code>Header</code> or <code>Tabbed</code></td></tr>
<tr><td>Too much for one page</td><td>[[tabs|<code>Tabs</code>]]</td></tr>
<tr><td>A question</td><td>[[dialog|<code>ctx.Dialogs</code>]]: <code>Confirm</code>, <code>Notice</code>, <code>Choose</code>, <code>Prompt</code></td></tr></tbody></table>
<p>Text: <code>panel.Text(text, UiTextStyle.Body)</code> and the other styles. Layout: <code>Divider</code>, <code>Fact</code>, <code>Info</code>, <code>BeginInline()</code>/<code>EndInline()</code>. See each one live in the [[gallery|Gallery]].</p>`,
          callout: { title: "Fonts, colors and alignment", warn: true, text: "This is where AI-built UIs usually go wrong. Give every line a named <a href=\"https://github.com/VRising-Modders/Progenitor/blob/main/docs/ui-controls.md#text-styles\">text style</a>; never set a color, size, font or alignment. Numbers right, text left, button captions and titles centered. Check every label in the game before calling a window done." } },
        { id: "controls", title: "The controls, by category",
          html: `<table><thead><tr><th class="label">Category</th><th class="label">Controls</th></tr></thead><tbody>
<tr><td>Layout and windows</td><td>[[window-preset|<code>ctx.Windows.Create</code>]], [[text-style|<code>panel.Text</code>]], <code>Divider</code>, <code>BeginInline</code>, [[tabs|<code>Tabs</code>]]</td></tr>
<tr><td>Input</td><td><code>Button</code>, <code>ConfirmButton</code>, <code>Toggle</code>, [[dropdown-radio|<code>Dropdown</code>, <code>Radio</code>]], <code>MultiSelect</code>, [[slider|<code>Slider</code>, <code>SliderField</code>, <code>Number</code>]], <code>Input</code>, <code>TextArea</code>, <code>ColorField</code>, <code>DateTimeField</code>, [[key-field|<code>KeyField</code>]], <code>CodeArea</code></td></tr>
<tr><td>Lists and data</td><td>[[ordered-list|<code>OrderedList</code>]], [[picker|<code>Picker</code>]], [[data-table|<code>DataTable</code>]], [[checklist|<code>Checklist</code>]], [[master-detail|<code>MasterDetail</code>]], [[chips|<code>Chips</code>]]</td></tr>
<tr><td>Feedback</td><td>[[tooltip|<code>Tooltip</code>]], [[term-tooltip|<code>Term</code>]], [[tip-card|<code>ctx.Hud.Tip</code>]], <code>ctx.Dialogs</code>, <code>ctx.Hud.Notify</code>, <code>Label(text, tone)</code></td></tr>
<tr><td>HUD and world</td><td>[[locate|<code>ctx.Hud.Locate</code>]], [[pick-in-world|<code>ctx.Hud.PickInWorld</code>]]</td></tr>
<tr><td>Game panels</td><td>[[vanilla-attach|<code>Ui.AttachToVanilla</code>]]</td></tr></tbody></table>
<p>Catalog, with each control's text style: <a href="https://github.com/VRising-Modders/Progenitor/blob/main/docs/ui-controls.md">docs/ui-controls.md</a>. In game: the controls sample's [[gallery|Gallery]]. Choosing: <a href="https://github.com/VRising-Modders/Progenitor/blob/main/docs/ui-style.md">UI style guide</a>.</p>` },
        { id: "messages", title: "Messages to players",
          html: `<p>Write the message alone, one sentence: the [[message-prefix|prefix]] makes it <code>&lt;Mod Name&gt;: &lt;message&gt;</code>. Client [[notice|notice]]: <code>ctx.Hud.Notify(text, detail, kind)</code>. Server chat: <code>ctx.Chat.SendTo(user, text)</code>. Command reply: <code>Reply(text)</code>.</p>
<div class="grid two"><div><b>Info</b>Something happened (default).</div><div class="ok"><b>Success</b>An action finished.</div><div class="pend"><b>Warning</b>Worth a look.</div><div class="bad"><b>Error</b>Something failed.</div></div>`,
          callout: { title: "Player must act?", text: "Use <code>ctx.Dialogs</code>." } },
        { id: "mods-page", title: "Your Mods page",
          html: `<p>Your [[mods-page|Mods page]]'s About text, first found wins:</p><ol><li>the installed Thunderstore package's README;</li><li>an embedded <code>README.md</code>;</li><li>[[mod-about|<code>[ModAbout("...")]</code>]];</li><li>the <code>ctx.Menu.Register</code> description.</li></ol>
<p>Version: from <code>[BepInPlugin]</code>, <code>1.2.0</code> form, same as <code>manifest.json</code>. Example: <code>samples/Progenitor.AboutExample</code>.</p>` },
        { id: "help-page", title: "Your help page",

    /* ---------------- Every role: getting help ---------------- */
    {
      id: "help", title: "Get Help", pages: [
        { id: "ai-help", title: "Get help from an AI assistant",
          html: `<p>Open ChatGPT, Gemini, Grok, Claude or another assistant, paste this prompt and add your question. For a problem, also attach your log zip (<a href="#help/collect-logs">Collect logs</a>). It lists your mods and their links.</p>{{code}}
<p>No zip? Each mod's page in the Mods menu shows its version, and <strong>Store page</strong> opens its Thunderstore page. Paste the names, versions and links.</p>
<p>Found a bug? <a href="https://github.com/VRising-Modders/Progenitor/blob/main/SUPPORT.md">SUPPORT.md</a> shows how to report it.</p>`,
          code: { lang: "prompt", text: `I play, run a server or make mods for V Rising with Progenitor
(https://github.com/VRising-Modders/Progenitor). Help me with my question
about Progenitor or a mod that uses it.

- First read the repository's llms.txt and the Help Guide pages for my role
  (docs/guide/progenitor-guide.html).
- For other mods, use the mod list (mods.md in the log zip, or the list
  I paste) and each mod's linked page or repository.
- Answer questions directly. Ask for my Progenitor and V Rising versions,
  mod list or logs only when you need them, e.g. for a problem or crash.
- For a problem: the likely cause, then steps I can follow in the game or
  the game folder. If it looks like a bug, help me write a short report for
  the Progenitor Discord channel or GitHub.

My question:` } },
        { id: "collect-logs", title: "Collect logs", shot: { src: "img/help-collect-logs.webp", alt: "The Collect logs tile on Progenitor's Mods page after a collect, saying where the zip was saved", caption: "When the zip is ready, the tile says where it went." },
          html: `<ul><li><strong>Mods &rsaquo; Progenitor &rsaquo; Get help &rsaquo; Collect logs for a help post</strong>, or the zip icon at the bottom left of the title screen.</li>
<li>One zip lands on your Desktop and its folder opens; the path is on the clipboard.</li>
<li>Inside: BepInEx's log (this session and the two before it), the game's log, a list of your mods with their links, a few settings, and the logs of a private game or server running on this PC.</li>
<li>Removed: SteamIDs, IP addresses, your Windows user name, passwords and tokens. Character and server names stay.</li></ul>` },
        { id: "logs-settings", title: "Get help settings",
          html: `<table><thead><tr><th class="label">Row</th><th class="label">Default</th><th class="label">What it does</th></tr></thead><tbody>
<tr><td>Last bundle</td><td></td><td>The newest zip, or how the last collect went.</td></tr>
<tr><td>Open the logs folder</td><td></td><td>Opens where the zips go.</td></tr>
<tr><td>Save bundles in</td><td>Empty</td><td>A folder for the zips; empty is your Desktop.</td></tr>
<tr><td>Offer to open the Discord after saving</td><td>On</td><td>Asks whether to open the V Rising Mod Community Discord.</td></tr>
<tr><td>Include this server's logs</td><td>On</td><td>[[admin|Admins]] only: adds the joined server's logs under <code>server/</code>.</td></tr></tbody></table>` },
      ]
    },

    { id: "glossary", title: "Glossary", pages: [ { id: "terms", title: "Glossary", lede: "Hover an underlined word anywhere to see its entry.", glossary: true } ] }
  ],
  glossary: [
    { id: "progenitor", term: "Progenitor", def: "A V Rising modding framework that gives every mod one in-game Mods menu for settings, keybinds and installs, and gives mod makers settings, UI, networking and hot reload." },
    { id: "game-folder", term: "Game folder", def: "The V Rising install folder that holds <code>VRising.exe</code>; BepInEx and Progenitor go inside it." },
    { id: "server-setting", term: "Server setting", def: "A mod setting the server decides for everyone on it; while you are joined it shows the server's value, which only admins change." },
    { id: "photo-mode", term: "Photo mode", def: "Progenitor's free-flying camera with the HUD hidden, off by default; a server can disallow it." },
    { id: "install-tab", term: "Install Mods tab", def: "The Mods menu tab that lists Thunderstore mods and installs, updates or removes them in game." },
    { id: "server-tab", term: "Server tab", def: "The Mods menu tab for how the joined server is set up: rules, join settings, updates and backups; admins edit, everyone else reads." },
    { id: "required-mod", term: "Required client mod", def: "A client mod a server needs every player to have before they can join." },
    { id: "recommended-mod", term: "Recommended client mod", def: "A client mod a server suggests with a reason; players may skip it." },
    { id: "admin", term: "Admin", def: "A player on the server's admin list or authenticated with <code>adminauth</code> (or the host of a private game); every admin may change everything." },
    { id: "config-lock", term: "Config lock", def: "<code>[ServerSettings] LockedInGame</code> in the server's <code>progenitor.cfg</code>: groups of settings no admin can change in game." },
    { id: "remote-install", term: "Remote install", def: "An admin installing, updating or removing mods on the joined server from their own Install Mods tab." },
    { id: "restore-point", term: "Restore point", def: "A world backup or wipe archive an admin can put back; the restore runs at the next server start and backs up the current world first." },
    { id: "bepinex", term: "BepInEx", def: "The plugin loader V Rising mods run on, installed as BepInExPack_V_Rising." },
    { id: "plugin", term: "Plugin", def: "A mod's DLL and main class, which subclasses <code>ProgenitorPlugin&lt;TContext&gt;</code> and registers its work in <code>OnLoad</code>." },
    { id: "core", term: "Core", def: "<code>Progenitor.dll</code> in <code>BepInEx/progenitor-core</code>, the framework itself, which can be swapped while the game runs." },
    { id: "bootstrap", term: "Bootstrap", def: "<code>Progenitor.Bootstrap.dll</code> in <code>BepInEx/plugins</code>, loaded once per process to load Core; changing it needs a restart." },
    { id: "generation", term: "Generation", def: "One loaded copy of Core or a plugin; each hot reload makes a new one, and static fields do not carry over." },
    { id: "hot-reload", term: "Hot reload", def: "Replacing a mod or Core in the running game: the old version unloads and the new one loads, with no restart." },
    { id: "reload-folder", term: "Reload folder", def: "<code>BepInEx/progenitor-reload/</code>, checked once a second; each DLL there is loaded, and reloaded when it changes." },
    { id: "ctx", term: "ctx (plugin context)", def: "The object passed to <code>OnLoad</code> through which every registration goes, so unload can reverse it." },
    { id: "unload-reason", term: "Unload reason", def: "Why a plugin unloads (<code>Swap</code>, <code>Removal</code>, <code>Shutdown</code>, <code>Unknown</code>); only <code>Removal</code> should sweep saved state." },
    { id: "keybind", term: "Keybind", def: "A key registered with <code>ctx.Keybinds</code>, shown in the Keybinds tab, remappable and conflict-checked." },
    { id: "mod-settings", term: "Mod settings (player and server)", def: "Player settings change one player's game, saved on their PC or, for settings on this server, by the server just for them; server settings belong to the server and apply to everyone on it." },
    { id: "synced-setting", term: "Synced setting", def: "An entry bound with <code>ctx.Bind(..., synced: true)</code> whose server value is sent to clients for the session." },
    { id: "sides", term: "Server part and client part", def: "The same mod DLL loaded on the server and on each client; <code>ctx.IsServer</code> and <code>ctx.IsClient</code> tell them apart." },
    { id: "handshake", term: "Handshake", def: "The join-time check where client and server compare mods and versions, so a missing required mod gets a clear message." },
    { id: "network-compatibility", term: "NetworkCompatibility", def: "A plugin attribute saying whether the other side must have the mod and how versions must match." },
    { id: "counterpart", term: "Counterpart", def: "The other side's part of a mod; <code>[Counterpart]</code> says how much still works without it." },
    { id: "mod-about", term: "ModAbout", def: "An attribute holding the Markdown your Mods page shows under About when there is no README." },
    { id: "mods-page", term: "Mods page", def: "A mod's page in the in-game Mods menu: status bar, header, About text, settings, keybinds and custom pages." },
    { id: "workspace", term: "Workspace", def: "The in-game Mods menu screen (title screen, or the Mods tab of the game's menu) with the Mods, Install Mods, Keybinds, Preferences and Server tabs." },
    { id: "window-preset", term: "Window preset", def: "<code>ctx.Windows.Create(UiWindowPreset.Basic | Header | Tabbed, title)</code>: a standard window with the game's frame, a centered title and a version stamp." },
    { id: "text-style", term: "Text style", def: "<code>panel.Text(text, UiTextStyle.X)</code>: Title, Section, Body, Muted, Number, Warning, Error or Success; it fixes the font, size, color and alignment." },
    { id: "gallery", term: "Gallery", def: "A page of the controls sample (Ctrl+F7, then Gallery) that shows every control, window preset and text style live." },
    { id: "message-prefix", term: "Message prefix", def: "<code>&lt;Mod Name&gt;: </code>, added by Progenitor in front of notices, chat messages and command replies; <code>prefix: false</code> turns it off." },
    { id: "panel", term: "Panel", def: "A floating window made with <code>Ui.Panel(...)</code> that the framework sizes and places; use a window preset unless none fits." },
    { id: "game-window", term: "GameWindow", def: "<code>panel.GameWindow()</code>: the game's popup frame for a plain panel, when no window preset fits; call it before adding controls." },
    { id: "widget", term: "Widget", def: "A composed UI kit control such as <code>Tabs</code>, <code>DataTable</code>, <code>Picker</code>, <code>OrderedList</code>, <code>MasterDetail</code> or <code>Chips</code>." },
    { id: "tabs", term: "Tabs", def: "Two to five short captions that switch groups of controls: <code>panel.Tabs(key, captions)</code>." },
    { id: "dropdown-radio", term: "Dropdown / Radio", def: "Pick one option: a radio shows two to four short ones together, a dropdown holds many or long ones." },
    { id: "slider", term: "Slider / SliderField / Number", def: "Number controls: rough amount, range plus exact box, or a small stepped count." },
    { id: "key-field", term: "KeyField", def: "A key-capture control for a bind registered with <code>ctx.Keybinds</code>." },
    { id: "ordered-list", term: "OrderedList", def: "A list the player arranges, such as a priority order, by dragging or arrows." },
    { id: "picker", term: "Picker", def: "Choose one or several of many named things (items, chests, players) with search; unpickable ones are grayed with a reason." },
    { id: "data-table", term: "DataTable", def: "Many records the player sorts, filters, selects and edits." },
    { id: "checklist", term: "Checklist", def: "Choose several of a long list (hundreds of chests or stations) with search, a filter and a checkbox on every row, then confirm." },
    { id: "master-detail", term: "MasterDetail", def: "A searchable list of named sets on the left, the selected one's editor on the right." },
    { id: "chips", term: "Chips", def: "A few short values the player adds and removes, such as members, tags or filters." },
    { id: "tooltip", term: "Tooltip", def: "Extra detail shown on hover; the control's name must still stand alone." },
    { id: "term-tooltip", term: "Term tooltip", def: "A mod's own word, defined with <code>UiTerms.Define</code> and marked with <code>handle.Term(term)</code>, explained on hover." },
    { id: "tip-card", term: "Tip card", def: "A one-time explanation of a screen, shown the first time it opens: <code>ctx.Hud.Tip</code>." },
    { id: "dialog", term: "Dialog", def: "The game's modal popup for a question: <code>ctx.Dialogs.Confirm</code>, <code>Notice</code>, <code>Choose</code>, <code>Prompt</code>." },
    { id: "notice", term: "Notice", def: "A short banner message from <code>ctx.Hud.Notify</code>, of kind Info, Success, Warning or Error." },
    { id: "locate", term: "Locate", def: "<code>ctx.Hud.Locate</code>: a marker over something in the world with its name and how far you are from it, and an edge arrow while it is off screen, for a few seconds." },
    { id: "pick-in-world", term: "Pick in world", def: "<code>ctx.Hud.PickInWorld</code>: the player chooses a chest or station by interacting with it; Escape cancels." },
    { id: "vanilla-attach", term: "Game-panel attachment", def: "<code>Ui.AttachToVanilla(site, anchor, ...)</code>: a button or line on a game panel such as a chest, station, inventory, castle heart (also its top-right icon row), item tooltip or recipe tooltip, including under one requirement line, right under a tooltip's title, at its very bottom, or as a key hint in the game's own style." },
    { id: "requests", term: "Requests / Subscriptions", def: "<code>ctx.Requests</code> sends a typed client request the server answers or refuses; <code>ctx.Subscriptions</code> follows a server topic's updates." },
    { id: "material-source", term: "MaterialSource", def: "<code>ctx.MaterialSource</code>: one experimental server provider deciding where build and craft materials come from, and the counts a refinement station's recipe tooltip shows." },
    { id: "container-id", term: "ContainerId", def: "A stable id for a placed chest or station that survives restarts and is never reused (<code>c-</code> plus 32 hex digits)." },
    { id: "territory", term: "Territory / plot", def: "The land a castle claims, made of tiles, read on the server through <code>ctx.Castles</code>." },
    { id: "castle-heart", term: "Castle heart", def: "The structure that claims a territory and keeps a castle running." },
    { id: "world-epoch", term: "World epoch", def: "A stamp of the current world load; keep it beside any held entity and check <code>ctx.WorldState.IsStale</code>." },
    { id: "mod-link", term: "Mod link", def: "A chat token such as <code>[mod:Namespace-Name]</code> that opens a mod's page or Install Mods listing when clicked, and never installs anything." },
    { id: "thunderstore", term: "Thunderstore", def: "The mod site the Install Mods tab installs mods from. Progenitor itself comes from its GitHub releases." },
    { id: "stamp", term: "Progenitor stamp", def: "An optional corner mark on a mod's icon showing it runs on Progenitor; it is not an endorsement." },
    { id: "dev-bridge", term: "Dev bridge", def: "<code>Progenitor.Dev</code>: a local-only bridge and MCP server for building, reloading and testing in a test game; never on a public server." },
    { id: "game-free-test", term: "Game-free test", def: "A test that runs with <code>dotnet test</code> and no game install, as CI does." }
  ]
};
</script>

<script>
/* Renderer: shared by every Progenitor help page. Edit templates/help/index.html, then run tools/help-guide/sync.mjs. */
(function () {
  "use strict";
  var H = window.HELP || { chapters: [], glossary: [] };
  var hasRoles = !!(H.roles && H.roles.length);
  var KEY = "progenitor-help:" + (H.id || "help");
  function store(k, v) { try { if (v == null) localStorage.removeItem(KEY + k); else localStorage.setItem(KEY + k, v); } catch (e) { /* no storage */ } }

    });
    return ch;
  });
  var gloss = {};
  (H.glossary || []).forEach(function (g) { gloss[g.id] = g; });
  var roleById = {};
  (H.roles || []).forEach(function (r) { roleById[r.id] = r; });
  var role = hasRoles ? load(":role") : null;
  if (role && !roleById[role]) role = null;

  function path() {
    return pages.filter(function (p) { return !p.chapter.role || p.chapter.role === role; });
  }
  function firstPageOfRole(r) {
    for (var i = 0; i < pages.length; i++) if (pages[i].chapter.role === r) return pages[i];
    return pages[0];
  }
  function chooserPage() {
    for (var i = 0; i < pages.length; i++) if (pages[i].data.chooser) return pages[i];
    return null;
  }

  // ---- Rendering helpers ----
  var KW = {};
  ("using namespace public private protected internal sealed static readonly class struct interface enum new return if else var void bool int string double float true false null this override abstract virtual async await foreach for in is as get set out ref const typeof").split(" ").forEach(function (k) { KW[k] = 1; });
  function tintCs(src) {
    var re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|(\[[A-Z][A-Za-z]*(?=[(\]]))|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_][A-Za-z0-9_]*\b)/g, out = "", last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      var t = m[0];
      if (m[1]) out += '<span class="tk-c">' + esc(t) + "</span>";
      else if (m[2]) out += '<span class="tk-s">' + esc(t) + "</span>";
      else if (m[3]) out += '[<span class="tk-a">' + esc(t.slice(1)) + "</span>";
      else if (m[4]) out += '<span class="tk-n">' + t + "</span>";
      else if (KW[t]) out += '<span class="tk-k">' + t + "</span>";
      else if (/^[A-Z]/.test(t)) out += '<span class="tk-t">' + t + "</span>";

      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function tint(lang, src) {
    if (lang === "c#") return tintCs(src);
    if (lang === "xml") return esc(src).replace(/(&lt;\/?)([A-Za-z.]+)/g, '$1<span class="tk-k">$2</span>').replace(/([A-Za-z]+)=(&quot;[^&]*&quot;)/g, '<span class="tk-t">$1</span>=<span class="tk-s">$2</span>');
    if (lang === "shell") return esc(src).replace(/^(\s*)(dotnet|cd|powershell|node)\b/gm, '$1<span class="tk-k">$2</span>');
    return esc(src);
  }
  function terms(html) {
    return html.replace(/\[\[([a-z0-9-]+)\|([^\]]+)\]\]/g, function (_, id, words) {
      if (!gloss[id]) console.warn("Help: no glossary entry for " + id);
      return '<a class="term" data-term="' + id + '" href="#' + (glossaryKey || "") + ":" + id + '">' + words + "</a>";
    });
  }
  function plain(html) { return html.replace(/\[\[[a-z0-9-]+\|([^\]]+)\]\]/g, "$1").replace(/<[^>]+>/g, " ").replace(/&[a-z]+;/g, " "); }

  function renderPage(page) {
    var d = page.data, h = "<h1>" + esc(d.title) + (d.soon ? '<span class="soon">Coming soon</span>' : "") + "</h1>";
    if (d.lede) h += '<p class="lede">' + esc(d.lede) + "</p>";
    h += '<hr class="rule">';
    var body = terms(d.html || "");
    var code = "";
    if (d.code) code = '<div class="code"><span class="lang" aria-hidden="true">' + esc(d.code.lang || "") + '</span><pre><code>' + tint(d.code.lang, d.code.text.replace(/^\n/, "")) + '</code></pre><button class="btn copy" type="button" aria-label="Copy this code">Copy</button></div>';
    body = body.indexOf("{{code}}") > -1 ? body.replace("{{code}}", code) : body + code;
    if (d.chooser && hasRoles) {

        return '<button type="button" class="role" data-role="' + r.id + '" aria-pressed="' + (r.id === role) + '"><b>' + esc(r.title) + "</b>" + esc(r.blurb || "") + '<span class="go">Start here &rarr;</span></button>';

        (H.glossary || []).map(function (g) {

  }

  // ---- Header and footer ----
  var brand = $("brand");

    '<span><span class="brand-title">' + esc(H.title || "Help") + '</span><span class="brand-sub">' + esc(H.subtitle || "Help") + "</span></span>";
  brand.setAttribute("aria-label", H.title || "Help");
  $("foot").innerHTML = "<span>" + esc(H.title || "") + (H.version ? " " + esc(H.version) : "") + ' &middot; <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> turn pages, <span class="kbd">/</span> search</span><span>' + esc(H.footer || "") + "</span>";

  // ---- Sidebar ----
  var toc = $("toc"), app = $("app"), tocBtn = $("tocBtn");
  function renderToc(current) {
    var h = "";

      h += '<div class="rolebar"><span><span class="label">Your path</span><b>' + esc(roleById[role].title) + '</b></span><button class="btn" type="button" id="switchRole">Switch role</button></div>';
    }
    h += '<div class="label">Chapters</div><ol>';
    var seen = {};
    path().forEach(function (p) {
      var ch = p.chapter;
      if (seen[ch.id]) return;
      seen[ch.id] = 1;
      var isCur = current && current.chapter === ch;
      h += '<li class="chap' + (isCur ? " current" : "") + '"><button type="button" class="chap-btn" data-chapter="' + esc(ch.id) + '" aria-expanded="' + isCur + '"><span class="chev" aria-hidden="true">&#9656;</span>' + esc(ch.title) + '</button><ol class="pages">' +
        ch.pages.map(function (q, i) {
          return '<li><a href="#' + q.key + '"' + (q === current ? ' aria-current="page"' : "") + ">" + (ch.pages.length > 1 ? (i + 1) + ". " : "") + esc(q.title) + "</a></li>";

    });

    var cur = toc.querySelector('[aria-current="page"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest" });
  }
  toc.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.id === "switchRole") { var c = chooserPage(); if (c) go(c.key); return; }

      b.setAttribute("aria-expanded", open ? "false" : "true");
    }
  });
  // On narrow screens Contents is a drawer over the page: closed by default, closed again after each page turn.
  var narrowMq = window.matchMedia ? window.matchMedia("(max-width: 760px)") : null;
  function narrow() { return !!(narrowMq && narrowMq.matches); }
  function setToc(open) { app.classList.toggle("toc-closed", !open); tocBtn.setAttribute("aria-expanded", String(open)); }
  if (narrow()) setToc(false);
  if (narrowMq) {
    var onWidth = function () { setToc(!narrow()); };
    if (narrowMq.addEventListener) narrowMq.addEventListener("change", onWidth); else if (narrowMq.addListener) narrowMq.addListener(onWidth);
  }
  tocBtn.addEventListener("click", function () { setToc(app.classList.contains("toc-closed")); });
  $("scrim").addEventListener("click", function () { setToc(false); });

  // ---- Navigation ----
  var current = null, card = $("card"), prevBtn = $("prevBtn"), nextBtn = $("nextBtn");
  function setRole(r) { role = r; store(":role", r); }
  // Opening another path's page (a search result, a link) moves the reader onto that path, so Previous and Next
  // stay on the path of the page shown. The page then says so once, with a way back.
  function show(page) {
    if (!page) page = pages[0];
    var from = null, fromPage = current;
    if (hasRoles && page.chapter.role && page.chapter.role !== role) { from = role; setRole(page.chapter.role); }
    current = page;
    card.innerHTML = renderPage(page);
    if (from && roleById[from] && fromPage) {
      card.insertAdjacentHTML("afterbegin", '<p class="pathnote"><span>You are now on the <b>' + esc(roleById[role].title) + "</b> path.</span>" +
        '<button class="btn" type="button" id="pathBack" data-role="' + esc(from) + '" data-page="' + esc(fromPage.key) + '">Back to ' + esc(roleById[from].title) + "</button></p>");
      $("pathBack").addEventListener("click", function () { setRole(this.dataset.role); go(this.dataset.page); });
    }
    wireCard();
    var ch = page.chapter, list = path(), i = list.indexOf(page);
    document.title = page.title + " · " + (H.title || "Help");
    $("crumbLeft").textContent = (hasRoles && role && ch.role ? roleById[role].title + " · " : "") + ch.title;
    var inCh = ch.pages.indexOf(page);
    $("counter").textContent = (inCh + 1) + " / " + ch.pages.length;
    $("counterSub").textContent = ch.title;
    $("dots").innerHTML = ch.pages.length > 1 ? ch.pages.map(function (q) { return q === page ? '<span class="on"></span>' : "<span></span>"; }).join("") : "";
    var prev = list[i - 1], next = list[i + 1];
    var blocked = hasRoles && !role && page.data.chooser;
    prevBtn.disabled = !prev; nextBtn.disabled = !next || blocked;
    $("prevTitle").textContent = prev ? prev.title : "Start";
    $("nextTitle").textContent = blocked ? "Choose a path" : next ? next.title : "End";
    prevBtn.setAttribute("aria-label", prev ? "Previous page: " + prev.title : "No previous page");
    nextBtn.setAttribute("aria-label", blocked ? "Choose a path first" : next ? "Next page: " + next.title : "No next page");

    if (narrow()) setToc(false);

    window.scrollTo(0, 0);
  }
  function parseHash(h) {
    h = decodeURIComponent((h || "").replace(/^#/, ""));
    var c = h.indexOf(":");
    return c > -1 ? { key: h.slice(0, c), term: h.slice(c + 1) } : { key: h, term: null };
  }
  function go(key, term) {
    var target = "#" + key + (term ? ":" + term : "");
    try { if (location.hash !== target) history.pushState(null, "", target); } catch (e) { /* hash not writable */ }

  }
  function route(r) {

    var page = byKey[r.key];
    if (!page) { var ch = chapters.filter(function (c) { return c.id === r.key; })[0]; page = ch && ch.pages[0]; }
    show(page || pages[0]);
    if (r.term) flashTerm(r.term);
  }
  prevBtn.addEventListener("click", function () { var l = path(), i = l.indexOf(current); if (l[i - 1]) go(l[i - 1].key); });
  nextBtn.addEventListener("click", function () { var l = path(), i = l.indexOf(current); if (l[i + 1]) go(l[i + 1].key); });
  window.addEventListener("hashchange", function () { route(); });
  window.addEventListener("popstate", function () { route(); });
  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey && e.button === 0) {
      var r = parseHash(a.getAttribute("href"));
      if (byKey[r.key]) { e.preventDefault(); closeResults(); go(r.key, r.term); return; }
    }
    if (!e.target.closest || !e.target.closest(".search")) closeResults();
  });
  document.addEventListener("keydown", function (e) {
    var t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if (e.key === "Escape") { hideTip(); closeResults(); if (narrow() && !app.classList.contains("toc-closed")) { setToc(false); tocBtn.focus(); } }
    if (typing || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight" && !nextBtn.disabled) { e.preventDefault(); nextBtn.click(); }
    else if (e.key === "ArrowLeft" && !prevBtn.disabled) { e.preventDefault(); prevBtn.click(); }
    else if (e.key === "/") { e.preventDefault(); search.focus(); }
  });

  // ---- Per-page wiring: copy buttons, role cards, glossary, terms ----
  function copyText(text, done) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
      document.body.removeChild(ta); done(ok);

  }
  function wireCard() {
    Array.prototype.forEach.call(card.querySelectorAll("table"), function (t) {
      if (t.parentNode.classList.contains("tbl")) return;
      var w = document.createElement("div"); w.className = "tbl";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    Array.prototype.forEach.call(card.querySelectorAll(".copy"), function (b) {
      b.addEventListener("click", function () {
        copyText(current.data.code.text.replace(/^\n/, ""), function (ok) {
          b.textContent = ok ? "Copied" : "Press Ctrl+C";
          setTimeout(function () { b.textContent = "Copy"; }, 1600);
        });
      });
    });
    Array.prototype.forEach.call(card.querySelectorAll(".role"), function (b) {
      b.addEventListener("click", function () { setRole(b.dataset.role); go(firstPageOfRole(b.dataset.role).key); });
    });
    var gs = $("glSearch");
    if (gs) { gs.addEventListener("input", filterGlossary); filterGlossary(); }
    Array.prototype.forEach.call(card.querySelectorAll("a.term"), function (a) {
      a.addEventListener("mouseenter", function () { showTip(a); });
      a.addEventListener("mouseleave", hideTip);
      a.addEventListener("focus", function () { showTip(a); });
      a.addEventListener("blur", hideTip);
    });
  }
  function filterGlossary() {
    var gs = $("glSearch"), q = gs.value.trim().toLowerCase(), n = 0, all = card.querySelectorAll(".gl-entry");
    Array.prototype.forEach.call(all, function (el) { var hit = !q || el.textContent.toLowerCase().indexOf(q) > -1; el.hidden = !hit; if (hit) n++; });
    $("glCount").textContent = q ? n + " of " + all.length + " terms" : all.length + " terms";
  }
  function flashTerm(id) {
    var el = $("term-" + id), list = $("glList");
    if (!el || !list) return;

  }
  var tip = $("tip"), tipFor = null;
  function showTip(a) {
    var g = gloss[a.dataset.term];
    if (!g) return;
    tipFor = a;
    tip.innerHTML = "<b>" + esc(g.term) + "</b>" + g.def + "<small>Click for the glossary.</small>";

    if (d.glossary) text += " " + (H.glossary || []).map(function (g) { return g.term + " " + plain(g.def); }).join(" ");

      var t = row.page.title.toLowerCase(), x = row.text.toLowerCase(), s = 0;
      for (var i = 0; i < words.length; i++) { if (t.indexOf(words[i]) > -1) s += 10; else if (x.indexOf(words[i]) > -1) s += 1; else return null; }

    var mine = hits.filter(own).slice(0, 10), other = hits.filter(function (h) { return !own(h); }).slice(0, 6), n = 0;
    function item(h) {
      var p = h.row.page, x = h.row.text.toLowerCase().indexOf(words[0]);

      var r = p.chapter.role, where = (r && roleById[r] && r !== role ? roleById[r].title + " · " : "") + p.chapter.title;

    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }

    } else if (e.key === "Escape") { search.value = ""; closeResults(); }
  });

  // ---- Start: the hash wins, then the last page, then the first page ----
  if (location.hash && location.hash.length > 1) route();
  else {
    var saved = load(":page"), start = byKey[saved] || pages[0];

    }
  }
})();
