name: Feature request
description: Suggest something Progenitor should do, for players, server operators or mod authors.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](../blob/main/docs/roadmap.md) and existing issues first; the idea may already be planned.
  - type: dropdown
    id: audience
    attributes:
      label: Who is it for?
      options:
        - Players
        - Server operators
        - Mod authors (API)
        - Development tools
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you are trying to do and why it is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: For an API request, a short code sketch of how a mod would use it helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered (optional)
